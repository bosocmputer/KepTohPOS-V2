name: app
description: KepToh POS Flutter Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.2
  hugeicons: ^0.0.7
  http: ^1.0.0
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/logo.jpg
    - assets/logo_name.jpg
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-Medium.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Thai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
