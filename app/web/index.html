<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="เก็บโต๊ะ POS ระบบจัดการหน้าร้าน คุมสต็อกวัตถุดิบ และคำนวณกำไรรายวัน">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="เก็บโต๊ะ POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>เก็บโต๊ะ POS (KepToh POS) — ระบบจัดการหน้าร้านและคำนวณกำไร</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Segoe UI", Roboto, sans-serif;
    }
    #keptoh-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(255, 122, 0, 0.08) 0%, #F4F4F5 68%);
      transition: opacity 0.24s ease-out;
    }
    #keptoh-boot-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .boot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 340px;
      padding: 28px 24px;
      background: #FFFFFF;
      border: 1px solid #E2E4E9;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    }
    .boot-logo-badge {
      padding: 10px;
      border-radius: 20px;
      background: #FFF1E4;
      margin-bottom: 16px;
      animation: keptoh-pulse 2s ease-in-out infinite;
    }
    .boot-logo {
      display: block;
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: contain;
      background: #FFFFFF;
    }
    .boot-title {
      font-size: 22px;
      font-weight: 700;
      color: #172033;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
    }
    .boot-sub {
      font-size: 14px;
      font-weight: 500;
      color: #5B6475;
      margin: 0 0 20px 0;
    }
    .boot-progress-track {
      position: relative;
      width: 180px;
      height: 5px;
      border-radius: 999px;
      background: #FFF1E4;
      overflow: hidden;
    }
    .boot-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      border-radius: 999px;
      background: #FF7A00;
      animation: keptoh-progress 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes keptoh-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.18); }
      50% { box-shadow: 0 0 0 8px rgba(255, 122, 0, 0); }
    }
    @keyframes keptoh-progress {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="keptoh-boot-loader" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-logo-badge">
        <img class="boot-logo" src="logo.jpg" onerror="this.onerror=null;this.src='assets/assets/logo.jpg';" alt="เก็บโต๊ะ POS" />
      </div>
      <p class="boot-title">เก็บโต๊ะ POS</p>
      <p class="boot-sub">กำลังเตรียมระบบหน้าร้าน...</p>
      <div class="boot-progress-track">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function dismissBootLoader() {
        var loader = document.getElementById('keptoh-boot-loader');
        if (!loader) return;
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 260);
      }
      window.addEventListener('flutter-first-frame', dismissBootLoader, { once: true });
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          observer.disconnect();
          setTimeout(dismissBootLoader, 600);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script>
    // Keeps the app's files on this device so it opens without internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('service worker not registered', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
