<!doctype html>
<html lang="th" data-brand="figma">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KepToh POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script>
/* ธีม/โหมดเก็บต่อเครื่อง (localStorage) และตั้งค่าก่อนวาดหน้าจอแรกเพื่อไม่ให้กระพริบ
   data-brand = figma | team · data-theme = light | dark ("ตามเครื่อง" แปลงเป็น light/dark ที่นี่) */
(function () {
  var K = 'keptoh-ui-prefs', mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function read() {
    try { var p = JSON.parse(localStorage.getItem(K) || '{}'); return { brand: p.brand === 'team' ? 'team' : 'figma', mode: p.mode === 'dark' || p.mode === 'light' ? p.mode : 'system' }; }
    catch (e) { return { brand: 'figma', mode: 'system' }; }
  }
  function apply(p) { var d = document.documentElement; d.setAttribute('data-brand', p.brand); d.setAttribute('data-theme', p.mode === 'system' ? (mq && mq.matches ? 'dark' : 'light') : p.mode); }
  window.KeptohTheme = { get: read, set: function (patch) { var p = Object.assign(read(), patch); try { localStorage.setItem(K, JSON.stringify(p)); } catch (e) { } apply(p); return p; } };
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (read().mode === 'system') apply(read()); });
  apply(read());
})();
</script>
<script src="data/mock-data.js"></script>
<style>
/* Layout: แท็บเล็ตแนวนอน = แถบเมนูซ้าย (rail) + ลิ้นชักเมนู (drawer) + พื้นที่ทำงาน / มือถือ = เมนูล่าง
   สี/มุมโค้ง/ระยะห่าง/ฟอนต์ ทั้งหมดมาจาก theme.css (ห้ามเขียนค่าตรงในไฟล์นี้) */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{height:100%}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
.num,.dt td,.dt th{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;gap:var(--space-1);padding-block:14px;padding-left:env(safe-area-inset-left,0px);overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:12px;color:var(--side-ink-strong);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.brand-mark{width:44px;height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:0;background:none;font-size:12.5px;border-radius:var(--radius-md);margin-inline:10px;cursor:pointer;color:var(--side-ink)}
.nav-btn:hover{background:var(--side-hover)}
.nav-btn[aria-current="page"]{background:var(--primary);color:var(--on-primary);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.content{flex:1;overflow-y:auto;padding-block:20px 40px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{order:2;border-right:0;border-top:1px solid var(--side-line);flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));overflow-x:auto;gap:2px}
  .brand{display:none}
  .nav-btn{margin:0;min-width:62px;flex:1}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-dark{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn-danger-solid:hover{filter:brightness(.92)}
.btn-danger{color:var(--danger-ink);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:var(--radius-sm)}
.btn-lg{min-height:56px;font-size:17px;padding:0 22px}
.btn-block{width:100%}
.icon-btn{min-height:var(--tap);width:var(--tap);padding:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.orange{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
.pill.green{background:var(--success-soft);border-color:transparent;color:var(--success-ink)}
.pill.red{background:var(--danger-soft);border-color:transparent;color:var(--danger-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v.green{color:var(--success-ink)} .stat .v.red{color:var(--danger-ink)}

.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:14px;text-align:left;min-height:128px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .08s}
.tcard:active{transform:scale(.98)}
.tcard .tname{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
.tcard.busy{border-color:var(--primary);background:var(--primary-soft)}
.tcard.late{border-color:var(--danger);background:var(--danger-soft)}
.tcard .free{color:var(--muted);font-size:13px;margin-top:auto}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-pop)}
.modal.wide{width:min(1000px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;overflow-y:auto;flex:1;min-height:0}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2)}
@media (max-width:600px){.overlay{padding:0}.modal,.modal.wide{border-radius:0;width:100%;height:100%;max-height:none}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13.5px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:12.5px}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);padding:8px 12px;font:inherit}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--primary)}

.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
.stepper button{width:48px;height:48px;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.stepper output{min-width:52px;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

.order{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.order{grid-template-columns:minmax(0,1fr)}}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pkg{border:2px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pkg[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.pkg .price{font-family:var(--font-display);font-weight:700;font-size:20px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-2)}
.addons{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.addon{position:relative;border:1.5px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer;min-height:68px}
.addon .badge{position:absolute;top:-8px;right:-6px;background:var(--primary);color:var(--on-primary);font-weight:700;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:8px;align-self:start}
.line{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.line .q{color:var(--muted)}
.total{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.method{border:2px solid var(--line);border-radius:var(--radius-sm);padding:14px;background:var(--surface);cursor:pointer;font-weight:600;min-height:64px}
.method[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;background:var(--qr-bg);color:var(--qr-ink);border-radius:var(--radius-md);border:1px solid var(--line)}
.qr img{width:220px;height:220px;image-rendering:pixelated}
.pp-head{background:var(--promptpay-blue);color:#fff;font-weight:700;padding:6px 14px;border-radius:var(--radius-sm);font-size:14px}

.paper{background:var(--paper);color:var(--paper-ink);width:min(330px,100%);margin:0 auto 12px;padding:20px 18px 24px;font-size:13px;line-height:1.55;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 30px rgba(0,0,0,.10);font-variant-numeric:tabular-nums}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,var(--paper) 6px,transparent 6.5px) 0 0/12px 8px repeat-x}
.paper .c{text-align:center}
.paper .shop{font-family:var(--font-display);font-size:17px;font-weight:700}
.paper .rule{border-top:1px dashed var(--paper-rule);margin:8px 0}
.paper .big{font-size:18px;font-weight:700}
.paper .void{position:absolute;inset:40% 0 auto;text-align:center;transform:rotate(-14deg);font-family:var(--font-display);font-size:42px;font-weight:700;color:color-mix(in srgb,var(--paper-danger) 55%,transparent);border:4px solid color-mix(in srgb,var(--paper-danger) 45%,transparent);margin:0 30px;border-radius:10px;pointer-events:none}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt .r{text-align:right}
.dt .c{text-align:center}
.dt tr.click{cursor:pointer}
.dt tr.click:hover td{background:var(--surface-2)}
.dt tfoot td{font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--line)}
.dt input.input{min-height:40px;max-width:120px;text-align:right}
.g{color:var(--success-ink)} .rd{color:var(--danger-ink)} .m{color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}

.setup{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.setup-nav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.setup-nav button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-weight:500}
.setup-nav button[aria-current="true"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
@media (max-width:860px){.setup{grid-template-columns:minmax(0,1fr)}.setup-nav{flex-direction:row;overflow-x:auto}.setup-nav button{white-space:nowrap}}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--primary-soft);color:var(--ink);border:1px solid transparent}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:max(16px,calc(env(safe-area-inset-top,0px) + 12px));background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:var(--radius-md);z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .pos{fill:var(--success)} .chart .neg{fill:var(--danger)} .chart .open{fill:var(--line)}
.chart .axis{stroke:var(--line)} .chart .zero{stroke:var(--muted);stroke-width:1}
.share{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.share>i{display:block;height:100%;background:var(--primary)}
.pins{display:flex;gap:12px;justify-content:center;margin:8px 0 16px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pins i.on{background:var(--primary);border-color:var(--primary)}
.result{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;padding:var(--space-4) var(--space-4) var(--space-5)}
.result .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--on-dark);background:var(--success);box-shadow:0 0 0 8px var(--success-soft)}
.result.red .ic{background:var(--danger);box-shadow:0 0 0 8px var(--danger-soft)}
.result strong{font-family:var(--font-display);font-size:18px;margin-top:var(--space-2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.pager .pages{display:flex;gap:var(--space-1)}
.pager .pages .btn{min-width:40px;padding:0 var(--space-2)}
.pager .pages .btn[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
/* ===== shared: header / toolbar / search / avatar ===== */
.who{display:inline-flex;align-items:center;gap:var(--space-2)}
.who-t{display:flex;flex-direction:column;line-height:1.25}
.who-t .sub{font-size:var(--fs-xs)}
@media (max-width:760px){.who-t{display:none}}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.toolbar-main,.toolbar-end{display:flex;align-items:flex-end;gap:var(--space-3);flex-wrap:wrap;min-width:0}
.search{display:flex;align-items:center;gap:var(--space-2);min-height:var(--tap);min-width:240px;padding:0 var(--space-3);border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--muted)}
.search:focus-within{border-color:var(--primary)}
.search-input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);min-height:calc(var(--tap) - 6px)}
.search-clear{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:var(--tap);height:var(--tap);margin-right:calc(var(--space-3) * -1)}
.avatar{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font-family:var(--font-display);font-weight:700}

/* ===== shared: dropdown ===== */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:60px;padding:var(--space-2) var(--space-3);border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.dd-btn[aria-expanded="true"]{border-color:var(--primary)}
.dd-item{display:flex;align-items:center;gap:var(--space-3);min-width:0;flex:1}
.dd-t{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.dd-t .sub{font-size:var(--fs-xs)}
.dd-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + var(--space-1));margin:0;padding:var(--space-1);list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-pop);max-height:320px;overflow-y:auto}
.dd-opt{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:60px;padding:var(--space-2) var(--space-3);border:1.5px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.dd-opt:hover{background:var(--surface-2)}
.dd-opt.on{border-color:var(--primary);background:var(--primary-soft)}
.dd-opt.on svg{color:var(--primary-ink)}

/* ===== shared: numpad / pin ===== */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);max-width:320px;width:100%;margin:0 auto}
.np-key{height:60px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 22px var(--font-display);cursor:pointer;display:grid;place-items:center}
.np-key:hover{border-color:var(--muted)}
.np-key:active{background:var(--surface-2)}
.np-key.ghost{border-color:transparent;background:none;color:var(--muted)}

/* ===== shared: drawer (เมนูหลัก / แผงตัวกรอง) ===== */
.drawer-scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex}

<script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>

<script>
/* =====================================================================
   KepToh POS — Prototype (ข้อมูลจำลองทั้งหมด เก็บใน localStorage ของเครื่อง)
   โครงสร้าง: 1) utils  2) domain (คำนวณบิล/ต้นทุน)  3) seed mock data
              4) shared components  5) views  6) app shell
   ===================================================================== */
const { h, render } = preact;
const { useState, useEffect, useMemo, useRef } = preactHooks;
const html = htm.bind(h);

/* ---------- 1) utils ---------- */
const pad = (n, l = 2) => String(n).padStart(l, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => dkey(new Date());
const thDate = k => parseKey(k).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' });
const thDateShort = k => parseKey(k).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
const thMonth = k => parseKey(k + '-01').toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
const thTime = iso => new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
const fmt = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtQ = n => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const baht = (n, d = 0) => (n == null || isNaN(n)) ? '–' : '฿' + fmt(n, d);
const r2 = n => Math.round(n * 100) / 100;
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const COUNT_UNITS = ['ฟอง', 'แพ็ค', 'ถุง', 'ชิ้น', 'ขวด'];
const roundQty = (n, unit) => COUNT_UNITS.includes(unit) ? Math.round(n) : Math.round(n * 10) / 10;
const ROLE = { owner: 'เจ้าของร้าน', manager: 'ผู้จัดการ', cashier: 'แคชเชียร์' };
const PAY_TYPE = { cash: 'เงินสด', qr: 'QR พร้อมเพย์', transfer: 'โอนเงิน', card: 'บัตร' };
const VAT_MODE = { none: 'ไม่จด VAT', included: 'ราคารวม VAT 7% แล้ว', excluded: 'บวก VAT 7% เพิ่ม' };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* PromptPay (EMVCo) payload — สำหรับเดโม QR */
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function promptPayPayload(id, amount) {
  const t = (tag, v) => tag + pad(v.length) + v;
  const digits = String(id || '').replace(/\D/g, '');
  const acc = digits.length >= 13 ? t('02', digits) : t('01', ('0000000000000' + digits.replace(/^0/, '66')).slice(-13));
  let p = t('00', '01') + t('01', amount ? '12' : '11') + t('29', t('00', 'A000000677010111') + acc) + t('53', '764') + (amount ? t('54', amount.toFixed(2)) : '') + t('58', 'TH') + '6304';
  return p + crc16(p);
}

/* ---------- 2) domain ---------- */
function calcOrder(shop, pkg, a, c, f, addonLines) {
  const lines = [];
  if (pkg && a > 0) lines.push({ type: 'buffet', name: `${pkg.name} · ผู้ใหญ่`, qty: a, price: pkg.adultPrice });
  if (pkg && c > 0) lines.push({ type: 'buffet', name: `${pkg.name} · เด็ก`, qty: c, price: pkg.childPrice });
  if (pkg && f > 0) lines.push({ type: 'buffet', name: 'เด็กเล็ก (ทานฟรี)', qty: f, price: 0 });
  for (const l of addonLines) if (l.qty > 0) lines.push({ type: 'addon', id: l.addon.id, name: l.addon.name, qty: l.qty, price: l.addon.price, cost: l.addon.cost });
  const subtotal = r2(sum(lines, l => l.qty * l.price));
  const service = r2(subtotal * (+shop.servicePct || 0) / 100);
  const base = r2(subtotal + service);
  let vat = 0, total = base;
  if (shop.vatMode === 'included') vat = r2(base * 7 / 107);
  else if (shop.vatMode === 'excluded') { vat = r2(base * 0.07); total = r2(base + vat); }
  return { lines, subtotal, service, vat, total, heads: { a, c, f } };
}
const openShiftOf = s => s.shifts.find(x => !x.closedAt);

function makeBill(s, { id, at, tableId, staffId, shiftId, packageId, order, method, received }) {
  const date = dkey(new Date(at));
  s.seq[date] = (s.seq[date] || 0) + 1;
  const table = s.tables.find(t => t.id === tableId);
  const staff = s.staff.find(x => x.id === staffId);
  const isCash = method.type === 'cash';
  const bill = {
    id, no: date.slice(2).replace(/-/g, '') + '-' + pad(s.seq[date], 3), date, at,
    tableId, tableName: table ? table.name : '-', staffId, staffName: staff ? staff.name : '-', shiftId, packageId,
    ...order, methodId: method.id, methodName: method.name, methodType: method.type,
    received: isCash ? received : order.total, change: isCash ? r2(received - order.total) : 0, voided: false
  };
  s.sales.push(bill);
  return bill;
}

/* ต้นทุนวัตถุดิบ = ยอดยกมา + ซื้อเข้า − นับคงเหลือ (มูลค่าใช้ต้นทุนเฉลี่ยถ่วงน้ำหนัก — สมมติฐานรอยืนยัน) */
function computeLedger(s) {
  const tk = todayKey();
  const salesBy = {}, purchBy = {};
  for (const b of s.sales) (salesBy[b.date] = salesBy[b.date] || []).push(b);
  for (const p of s.purchases) (purchBy[p.date] = purchBy[p.date] || []).push(p);
  const st = {};
  for (const ing of s.ingredients) { const i0 = s.initialStock[ing.id]; st[ing.id] = { qty: i0 ? i0.qty : 0, avg: i0 ? i0.cost : ing.lastCost }; }
  const days = [], byDate = {};
  for (let d = parseKey(s.startDate); dkey(d) <= tk; d = addDays(d, 1)) {
    const k = dkey(d), cnt = s.counts[k], purch = purchBy[k] || [];
    const rows = []; let ingCost = 0;
    for (const ing of s.ingredients) {
      const cur = st[ing.id] || { qty: 0, avg: ing.lastCost };
      let pq = 0, pv = 0;
      for (const p of purch) for (const l of p.lines) if (l.ingId === ing.id) { pq += +l.qty || 0; pv += +l.total || 0; }
      const avail = cur.qty + pq;
      const avg = avail > 0 ? (Math.max(cur.qty, 0) * cur.avg + pv) / avail : (pq ? pv / pq : cur.avg);
      let closing = null, used = null, cost = null;
      if (cnt && cnt[ing.id] != null && cnt[ing.id] !== '') {
        closing = +cnt[ing.id]; used = Math.max(0, avail - closing); cost = used * avg; ingCost += cost;
        st[ing.id] = { qty: closing, avg };
      } else st[ing.id] = { qty: avail, avg };
      rows.push({ ing, opening: cur.qty, pq, pv, avail, avg, closing, used, cost });
    }
    const sales = (salesBy[k] || []).filter(b => !b.voided);
    let buffetNet = 0, addonNet = 0, addonCost = 0, gross = 0, net = 0, a = 0, c = 0, f = 0;
    for (const b of sales) {
      const nf = b.total > 0 ? (b.total - b.vat) / b.total : 1;
      gross += b.total; net += b.total - b.vat;
      a += b.heads.a; c += b.heads.c; f += b.heads.f;
      for (const l of b.lines) {
        const v = l.qty * l.price * (b.subtotal ? (b.subtotal + b.service) / b.subtotal : 1) * nf;
        if (l.type === 'addon') { addonNet += v; addonCost += l.qty * (l.cost || 0); } else buffetNet += v;
      }
    }
    const closed = !!cnt;
    const heads = a + c;
    const day = {
      date: k, closed, isToday: k === tk, bills: sales.length, a, c, f, heads, gross, net, buffetNet, addonNet, addonCost,
      purchases: sum(purch, p => sum(p.lines, l => +l.total)),
      ingCost: closed ? ingCost : null,
      profit: closed ? net - ingCost - addonCost : null,
      costPerHead: closed && heads ? ingCost / heads : null,
      foodPct: closed && buffetNet ? ingCost / buffetNet * 100 : null,
      rows
    };
    days.push(day); byDate[k] = day;
  }
  return { days, byDate, current: st };
}

/* ---------- 3) seed mock data (ร้านสมมติ อ้างอิงช่วงราคาจากการค้นข้อมูล ต.ค.–พ.ย. 2569) ---------- */
function seed() {
  const R = rng(20261103), now = new Date(), tk = dkey(now);
  const start = addDays(now, -30);
  const M = JSON.parse(JSON.stringify(window.KEPTOH_MOCK));   // ฐานร้านจาก data/mock-data.js (แก้ข้อมูลตัวอย่างที่ไฟล์นั้น)
  const s = { version: 1, startDate: dkey(start), seq: {}, counts: {}, sales: [], purchases: [], shifts: [], openTables: {}, initialStock: {}, ...M };
  const sim = {};
  for (const ing of s.ingredients) { const q = roundQty(ing.par * .25, ing.unit); s.initialStock[ing.id] = { qty: q, cost: ing.lastCost }; sim[ing.id] = q; }
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const at = (d, hh) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setMinutes(Math.round(hh * 60)); return x; };

  for (let i = 30; i >= 0; i--) {
    const day = addDays(now, -i), k = dkey(day), isToday = i === 0, dow = day.getDay();
    const factor = dow === 5 || dow === 6 ? 1.45 : dow === 0 ? 1.25 : 1;
    // ซื้อของตอนเช้า
    const bySup = {};
    for (const ing of s.ingredients) {
      const need = 95 * factor * ing.use * 1.15 - sim[ing.id];
      if (need <= 0) continue;
      const step = ing.unit === 'ฟอง' ? 30 : COUNT_UNITS.includes(ing.unit) ? 1 : .5;
      const qty = Math.ceil(need / step) * step;
      const price = ing.lastCost * (.95 + R() * .1);
      (bySup[ing.supplierId] = bySup[ing.supplierId] || []).push({ ingId: ing.id, qty: r2(qty), total: Math.round(qty * price) });
      sim[ing.id] += qty;
    }
    Object.entries(bySup).forEach(([sup, lines], j) => s.purchases.push({ id: uid('p'), date: k, at: at(day, 9 + j * .6).toISOString(), supplierId: sup, lines, note: '' }));
    // กะ
    const cashier = pick(['st3', 'st4']);
    const shiftOpen = isToday ? new Date(now.getTime() - 4.5 * 3600e3) : at(day, 16);
    const shift = { id: uid('sh'), staffId: cashier, openedAt: shiftOpen.toISOString(), float: 1000, closedAt: null, counted: null };
    s.shifts.push(shift);
    // ขาย
    const groups = isToday ? 9 : Math.round((22 + R() * 8) * factor);
    let eq = 0;
    for (let g = 0; g < groups; g++) {
      const size = 2 + Math.floor(R() * 5);
      let kids = R() < .3 ? 1 + Math.floor(R() * 2) : 0; kids = Math.min(kids, size - 1);
      const free = kids && R() < .4 ? 1 : 0, c = kids - free, a = size - kids;
      const pkg = R() < .78 ? s.packages[0] : s.packages[1];
      const ad = [
        { addon: s.addons[0], qty: Math.round(size * .5 * R()) }, { addon: s.addons[1], qty: 1 },
        { addon: s.addons[2], qty: R() < .4 ? 1 + Math.floor(R() * 2) : 0 },
        { addon: s.addons[3], qty: R() < .2 ? 2 : 0 },
        { addon: pick([s.addons[4], s.addons[5], s.addons[6]]), qty: R() < .55 ? 1 + Math.floor(R() * 4) : 0 }
      ];
      const order = calcOrder(s.shop, pkg, a, c, free, ad);
      const pr = R(), method = pr < .55 ? s.payments[1] : pr < .95 ? s.payments[0] : s.payments[2];
      const t = isToday ? new Date(Math.max(at(day, 0.1).getTime(), now.getTime() - (3.2 - g * .32) * 3600e3)) : at(day, 16.5 + R() * 5);
      const received = Math.ceil(order.total / 100) * 100 + (R() < .3 ? 500 : 0);
      const b = makeBill(s, { id: uid('b'), at: t.toISOString(), tableId: s.tables[(g * 5 + i) % 12].id, staffId: cashier, shiftId: shift.id, packageId: pkg.id, order, method, received });
      if (isToday && g >= groups - 4) {
        const tid = s.tables[[0, 2, 5, 9][g - (groups - 4)]].id; b.tableId = tid; b.tableName = s.tables.find(x => x.id === tid).name;
        s.openTables[tid] = { openedAt: b.at, packageId: pkg.id, billIds: [b.id], heads: { a, c, f: free } };
      }
      eq += a + c * .6 + free * .3;
    }
    if (!isToday) {
      const cnt = {};
      for (const ing of s.ingredients) {
        const used = eq * ing.use * (.88 + R() * .25);
        sim[ing.id] = roundQty(Math.max(0, sim[ing.id] - used), ing.unit);
        cnt[ing.id] = sim[ing.id];
      }
      s.counts[k] = cnt;
      const cash = sum(s.sales.filter(b => b.shiftId === shift.id && b.methodType === 'cash'), b => b.total);
      shift.closedAt = at(day, 23).toISOString();
      shift.counted = 1000 + cash + (R() < .75 ? 0 : Math.round((R() - .5) * 40));
    }
  }
  return s;
}

/* ---------- storage ---------- */
const LS_KEY = 'keptoh-proto-v1';
function loadState() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.version === 1) return o; } } catch (e) { }
  return seed();
}
function saveState(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { } }

/* ---------- 4) shared components ---------- */
const ICONS = {
  tables: html`<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>`,

  gear: html`<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>`,
  user: html`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`,
  plus: html`<path d="M12 5v14M5 12h14"/>`,
  minus: html`<path d="M5 12h14"/>`,
  x: html`<path d="M6 6l12 12M18 6L6 18"/>`,
  trash: html`<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>`,
  edit: html`<path d="M4 20h4L19 9l-4-4L4 16v4z"/>`,
  copy: html`<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>`,
  flame: html`<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>`,
  printer: html`<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>`,
  check: html`<path d="M5 12l5 5 9-10"/>`,
  sidebar: html`<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>`,
  logout: html`<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/>`,
  chevron: html`<path d="M6 9l6 6 6-6"/>`,
  search: html`<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>`,
  backspace: html`<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M12 9l5 6M17 9l-5 6"/>`
};
const Icon = ({ n, s = 20 }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

function Btn({ kind = '', size = '', icon, block, children, ...p }) {
  const cls = ['btn', kind && 'btn-' + kind, size && 'btn-' + size, block && 'btn-block', !children && 'icon-btn'].filter(Boolean).join(' ');
  return html`<button type="button" class=${cls} ...${p}>${icon && html`<${Icon} n=${icon} s=${18}/>`}${children}</button>`;
}
const Pill = ({ tone = '', children }) => html`<span class=${'pill ' + tone}>${children}</span>`;
function Modal({ title, sub, onClose, children, footer, wide }) {
  useEffect(() => { const k = e => e.key === 'Escape' && onClose && onClose(); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose && onClose()}>
    <div class=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title}>
      <div class="modal-h"><div class="grow"><h2>${title}</h2>${sub && html`<div class="sub">${sub}</div>`}</div>${onClose && html`<${Btn} kind="ghost" icon="x" aria-label="ปิด" onClick=${onClose}/>`}</div>
      <div class="modal-b">${children}</div>
      ${footer && html`<div class="modal-f">${footer}</div>`}

}
function Confirm({ title, text, yes = 'ยืนยัน', danger, onYes, onNo, children }) {

const Field = ({ label, hint, children }) => html`<label class="field"><span>${label}</span>${children}${hint && html`<small>${hint}</small>`}</label>`;
function Stepper({ value, onChange, min = 0, label }) {

/* ลิ้นชักข้าง (เมนูหลัก / แผงตัวกรอง) — Esc หรือแตะฉากหลังเพื่อปิด */
function Drawer({ onClose, side = 'left', label, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement, k = e => e.key === 'Escape' && onClose();
    addEventListener('keydown', k); ref.current && ref.current.focus();
    return () => { removeEventListener('keydown', k); prev && prev.focus && prev.focus(); };
  }, []);
  return html`<div class=${'drawer-scrim ' + side} onClick=${e => e.target === e.currentTarget && onClose()}>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label=${label} tabindex="-1" ref=${ref}>${children}</aside></div>`;
}
/* เลือกจากรายการ (options: [{ value, label, sub }]) · leading(o) ใส่ avatar/ไอคอนหน้าชื่อได้ */
function Dropdown({ value, options, onChange, label, placeholder = 'เลือก', leading }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const off = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }, k = e => e.key === 'Escape' && setOpen(false);
    addEventListener('pointerdown', off); addEventListener('keydown', k);
    return () => { removeEventListener('pointerdown', off); removeEventListener('keydown', k); };
  }, [open]);
  const sel = options.find(o => o.value === value);
  const item = o => html`<span class="dd-item">${leading && leading(o)}<span class="dd-t"><strong>${o.label}</strong>${o.sub && html`<span class="sub">${o.sub}</span>`}</span></span>`;
  return html`<div class="dd" ref=${ref}>
    <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded=${open} aria-label=${label} onClick=${() => setOpen(!open)}>${sel ? item(sel) : html`<span class="sub dd-item">${placeholder}</span>`}<${Icon} n="chevron" s=${18}/></button>
    ${open && html`<ul class="dd-list" role="listbox" aria-label=${label}>${options.map(o => html`<li role="presentation"><button type="button" role="option" aria-selected=${o.value === value} class=${'dd-opt' + (o.value === value ? ' on' : '')} onClick=${() => { onChange(o.value); setOpen(false); }}>${item(o)}${o.value === value && html`<${Icon} n="check" s=${18}/>`}</button></li>`)}</ul>`}
  </div>`;
}
/* ---- ข้อมูล ---- */
/* ตารางกลาง: columns [{ key, label, align:'r'|'c', render(row), className(row) }] · footer = <tr> ใน tfoot · head=false ซ่อนหัวตาราง */
function DataTable({ columns, rows, rowKey = r => r.id, onRowClick, footer, head = true, empty, label }) {
  if (!rows.length && empty) return empty;
  const al = c => c.align === 'r' ? 'r' : c.align === 'c' ? 'c' : '';
  const key = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.click(); } };
  return html`<div class="scroll"><table class="dt" aria-label=${label}>
    ${head && html`<thead><tr>${columns.map(c => html`<th scope="col" class=${al(c)}>${c.label}</th>`)}</tr></thead>`}
    <tbody>${rows.map(r => html`<tr key=${rowKey(r)} class=${onRowClick ? 'click' : ''} tabindex=${onRowClick ? 0 : null} onKeyDown=${onRowClick && key} onClick=${onRowClick && (() => onRowClick(r))}>
      ${columns.map(c => html`<td class=${(al(c) + ' ' + (c.className ? c.className(r) : '')).trim()}>${c.render ? c.render(r) : r[c.key]}</td>`)}</tr>`)}</tbody>
    ${footer && html`<tfoot>${footer}</tfoot>`}</table></div>`;
}
/* ---- ป้อนตัวเลข ---- */
/* แป้นตัวเลขกลาง (PIN / รับเงินสด / นับสต็อก) · value เป็น string · keyboard=true รับแป้นพิมพ์จริงด้วย (ไม่ทำงานเมื่อโฟกัสช่องกรอก) */
function NumPad({ value, onChange, maxLen = 12, decimal = false, keyboard = false, onEnter }) {
  // cur = ค่าล่าสุดแบบทันที (ก่อน re-render) กันตัวเลขหายเมื่อกดติดกันเร็ว · live = props ล่าสุดสำหรับ listener ที่ลงทะเบียนครั้งเดียว
  const cur = useRef(value); cur.current = value;
  const live = useRef(); live.current = { onChange, onEnter, maxLen, decimal };
  const set = v => { cur.current = v; live.current.onChange(v); };
  const push = d => {
    const v = cur.current, o = live.current;
    if (d === '.' && (!o.decimal || v.includes('.'))) return;
    if (v.length >= o.maxLen) return;
    set(d === '.' && !v ? '0.' : v + d);
  };
  const back = () => set(cur.current.slice(0, -1));
  useEffect(() => {
    if (!keyboard) return;
    const k = e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (/^[0-9]$/.test(e.key) || e.key === '.') { push(e.key); e.preventDefault(); }
      else if (e.key === 'Backspace') { back(); e.preventDefault(); }
      else if (e.key === 'Enter' && live.current.onEnter && tag !== 'BUTTON') { live.current.onEnter(cur.current); e.preventDefault(); }
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [keyboard]);
  const key = (d, l) => html`<button type="button" class="np-key" aria-label=${l || d} onClick=${() => push(d)}>${d}</button>`;
  return html`<div class="numpad" role="group" aria-label="แป้นตัวเลข">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => key(d))}
    ${decimal ? key('.', 'จุดทศนิยม') : html`<span></span>`}${key('0')}
    <button type="button" class="np-key ghost" aria-label="ลบตัวเลขท้ายสุด" onClick=${back}><${Icon} n="backspace" s=${24}/></button></div>`;
}

  const [voiding, setVoiding] = useState(false);
  const [reason, setReason] = useState('');
  if (!bill) return null;
  const canVoid = !bill.voided && me.role !== 'cashier';
  const doVoid = () => {
    update(st => { const b = st.sales.find(x => x.id === billId); b.voided = true; b.voidReason = reason || 'ไม่ระบุ'; b.voidBy = me.name; b.voidAt = new Date().toISOString(); });
    setVoiding(false); toast('ยกเลิกบิล ' + bill.no + ' แล้ว');
  };
  return html`<${Modal} title=${'บิล ' + bill.no} sub=${bill.voided ? 'บิลนี้ถูกยกเลิกแล้ว' : 'ชำระเงินแล้ว'} onClose=${onClose}
      footer=${html`${canVoid && html`<${Btn} kind="danger" icon="trash" onClick=${() => setVoiding(true)}>ยกเลิกบิล<//>`}
        <${Btn} icon="printer" disabled title="ต่อเครื่องพิมพ์ Bluetooth ในเฟสถัดไป">พิมพ์ (เฟสถัดไป)<//><${Btn} kind="primary" onClick=${onClose}>เสร็จ<//>`}>
    ${fresh && !bill.voided && html`<${ResultState} title="รับเงินเรียบร้อย" text=${bill.methodType === 'cash' ? 'เงินทอน ' + baht(bill.change, 2) : 'ชำระโดย ' + bill.methodName}/>`}
    <${Receipt} bill=${bill} shop=${s.shop}/>

}

function FormFields({ schema, val, set }) {
  return html`<div class="form-grid">${schema.filter(f => !f.hidden).map(f => {
    const v = val[f.key] ?? '', id = 'f-' + f.key;
    if (f.type === 'toggle') return html`<label class="toggle"><input id=${id} type="checkbox" checked=${!!val[f.key]} onChange=${e => set(f.key, e.target.checked)}/><span>${f.label}</span></label>`;
    let input;
    if (f.type === 'select') input = html`<select id=${id} class="input" value=${v} onChange=${e => set(f.key, e.target.value)}>${f.options().map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>`;
    else if (f.type === 'textarea') input = html`<textarea id=${id} class="input" value=${v} onInput=${e => set(f.key, e.target.value)}></textarea>`;
    else if (f.type === 'number') input = html`<input id=${id} class="input num" type="number" inputmode="decimal" step="any" min="0" value=${v} onInput=${e => set(f.key, e.target.value === '' ? '' : +e.target.value)}/>`;
    else input = html`<input id=${id} class="input" type="text" inputmode=${f.inputmode || 'text'} maxlength=${f.max || 200} value=${v} onInput=${e => set(f.key, e.target.value)}/>`;
    return html`<${Field} label=${f.label + (f.req ? ' *' : '')} hint=${f.hint}>${input}<//>`;
  })}</div>`;
}
function CrudSection({ title, desc, items, schema, blank, onSave, onDelete, guard }) {
  const [edit, setEdit] = useState(null);
  const [del, setDel] = useState(null);
  const [err, setErr] = useState('');
  const cols = schema.filter(f => f.list);
  const save = () => {
    const miss = schema.find(f => f.req && (edit[f.key] === '' || edit[f.key] == null));
    if (miss) { setErr('กรุณากรอก ' + miss.label); return; }
    if (edit.pin != null && !/^\d{4}$/.test(edit.pin)) { setErr('PIN ต้องเป็นตัวเลข 4 หลัก'); return; }
    onSave(edit); setEdit(null); setErr('');
  };
  const show = (f, it) => f.show ? f.show(it[f.key], it) : f.type === 'toggle' ? (it[f.key] ? html`<${Pill} tone="green">เปิดใช้<//>` : html`<${Pill}>ปิด<//>`) : f.type === 'number' ? fmtQ(it[f.key]) : it[f.key];
  return html`<div class="stack">
    <${PageHeader} title=${title} desc=${desc} actions=${html`<${Btn} kind="primary" icon="plus" onClick=${() => { setErr(''); setEdit({ ...blank() }); }}>เพิ่ม<//>`}/>
    <${DataTable} label=${title} rows=${items} empty=${html`<div class="card"><${Empty} title="ยังไม่มีรายการ" text="กด เพิ่ม เพื่อสร้างรายการแรก"/></div>`}
      columns=${[...cols.map(f => ({ key: f.key, label: f.label, align: f.type === 'number' ? 'r' : '', render: it => show(f, it) })),
        { key: '_act', label: 'จัดการ', align: 'r', render: it => html`<div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><${Btn} size="sm" icon="edit" aria-label=${'แก้ไข ' + (it.name || '')} onClick=${() => { setErr(''); setEdit({ ...it }); }}/><${Btn} size="sm" kind="danger" icon="trash" aria-label=${'ลบ ' + (it.name || '')} onClick=${() => setDel(it)}/></div>` }]}/>
    ${edit && html`<${Modal} title=${(items.some(i => i.id === edit.id) ? 'แก้ไข' : 'เพิ่ม') + title} onClose=${() => setEdit(null)} footer=${html`<${Btn} onClick=${() => setEdit(null)}>ยกเลิก<//><${Btn} kind="primary" icon="check" onClick=${save}>บันทึก<//>`}>
      <${FormFields} schema=${schema} val=${edit} set=${(k, v) => setEdit(e => ({ ...e, [k]: v }))}/>
      ${err && html`<p class="rd" style="margin:12px 0 0">${err}</p>`}<//>`}
    ${del && (() => { const g = guard && guard(del); return g
      ? html`<${Modal} title="ลบไม่ได้" onClose=${() => setDel(null)} footer=${html`<${Btn} kind="primary" onClick=${() => setDel(null)}>เข้าใจแล้ว<//>`}><p style="margin:0">${g}</p><//>`
      : html`<${Confirm} title=${'ลบ ' + (del.name || '') + '?'} text="ลบแล้วกู้คืนไม่ได้ ข้อมูลในบิลเก่ายังอยู่ครบ" yes="ลบ" danger onNo=${() => setDel(null)} onYes=${() => { onDelete(del.id); setDel(null); }}/>`; })()}
  </div>`;
}

  const pkgs = s.packages.filter(p => p.active);
  const methods = s.payments.filter(p => p.active);
  const [pkgId, setPkgId] = useState(occ ? occ.packageId : pkgs[0] && pkgs[0].id);
  const [a, setA] = useState(mode === 'open' ? 2 : 0);
  const [c, setC] = useState(0);
  const [f, setF] = useState(0);
  const [ad, setAd] = useState({});
  const [step, setStep] = useState('order');
  const [mid, setMid] = useState(methods[0] && methods[0].id);
  const [recv, setRecv] = useState('');
  const pkg = s.packages.find(p => p.id === pkgId);
  const addons = s.addons.filter(x => x.active);
  const order = calcOrder(s.shop, pkg, a, c, f, addons.map(x => ({ addon: x, qty: ad[x.id] || 0 })));
  const method = methods.find(m => m.id === mid);
  const recvN = parseFloat(recv) || 0;
  const hasPeople = a + c + f > 0;
  const canNext = order.lines.length > 0 && (mode === 'add' || hasPeople) && order.total > 0;
  const canPay = canNext && method && (method.type !== 'cash' || recvN >= order.total);
  const quick = [...new Set([order.total, Math.ceil(order.total / 100) * 100, 500, 1000, 2000].filter(v => v >= order.total))].slice(0, 4);
  const pay = () => {
    const id = uid('b'), at = new Date().toISOString();
    update(st => {
      makeBill(st, { id, at, tableId: table.id, staffId: me.id, shiftId: (openShiftOf(st) || {}).id, packageId: pkgId, order, method, received: method.type === 'cash' ? recvN : order.total });
      const o = st.openTables[table.id];
      if (o) { o.billIds.push(id); o.heads.a += a; o.heads.c += c; o.heads.f += f; }
      else st.openTables[table.id] = { openedAt: at, packageId: pkgId, billIds: [id], heads: { a, c, f } };
      for (const l of order.lines) if (l.type === 'addon') { const x = st.addons.find(z => z.id === l.id); if (x) x.stock = Math.max(0, (+x.stock || 0) - l.qty); }
    });
    onPaid(id);
  };
  const summary = html`<div class="summary">
    <div class="row between"><h3>สรุปรายการ</h3><span class="sub">โต๊ะ ${table.name}</span></div>
    ${order.lines.length ? order.lines.map(l => html`<div class="line"><span>${l.name} <span class="q">× ${l.qty}</span></span><span>${fmt(l.qty * l.price)}</span></div>`) : html`<span class="sub">ยังไม่มีรายการ</span>`}
    ${order.service > 0 && html`<div class="line"><span>ค่าบริการ ${s.shop.servicePct}%</span><span>${fmt(order.service, 2)}</span></div>`}
    ${s.shop.vatMode === 'excluded' && html`<div class="line"><span>VAT 7%</span><span>${fmt(order.vat, 2)}</span></div>`}
    <div class="line" style="align-items:baseline;border-top:1px dashed var(--line);padding-top:8px"><span>ยอดชำระ</span><span class="total">${baht(order.total, order.total % 1 ? 2 : 0)}</span></div>
    ${step === 'order' && html`<${Btn} kind="primary" size="lg" block disabled=${!canNext} onClick=${() => setStep('pay')}>ไปชำระเงิน (จ่ายก่อนทาน)<//>`}
  </div>`;
  return html`<${Modal} wide title=${mode === 'open' ? 'เปิดโต๊ะ ' + table.name : 'สั่งเพิ่ม · โต๊ะ ' + table.name} sub=${step === 'pay' ? 'ขั้นที่ 2/2 · รับชำระเงิน' : 'ขั้นที่ 1/2 · เลือกแพ็กเกจ จำนวนคน และของขายเสริม'} onClose=${onClose}
      footer=${step === 'pay' && html`<${Btn} onClick=${() => setStep('order')}>ย้อนกลับ<//><${Btn} kind="primary" size="lg" icon="check" disabled=${!canPay} onClick=${pay}>รับเงิน ${baht(order.total, order.total % 1 ? 2 : 0)}<//>`}>
    <div class="order">
      ${step === 'order' ? html`<div class="stack">
        ${mode === 'open' ? html`<div class="stack" style="gap:8px"><h3>แพ็กเกจ</h3><div class="pkgs">${pkgs.map(p => html`<button type="button" class="pkg" aria-pressed=${p.id === pkgId} onClick=${() => setPkgId(p.id)}>
            <strong>${p.name}</strong><span class="price num">${baht(p.adultPrice)} <small class="sub">/ ผู้ใหญ่</small></span>
            <span class="sub">เด็ก ${baht(p.childPrice)} · ${p.timeLimit ? 'จำกัด ' + p.timeLimit + ' นาที' : 'ไม่จำกัดเวลา'}</span></button>`)}</div></div>`
          : html`<div class="banner info">แพ็กเกจของโต๊ะนี้: <strong>${pkg && pkg.name}</strong> · เพิ่มคนหรือสั่งเครื่องดื่มเพิ่มได้ ระบบออกบิลแยกให้</div>`}
        <div class="stack" style="gap:8px"><h3>${mode === 'open' ? 'จำนวนลูกค้า' : 'เพิ่มคน (ถ้ามี)'}</h3><div class="people">
          <div class="person"><strong>ผู้ใหญ่</strong><span class="sub">${pkg && baht(pkg.adultPrice)}</span><${Stepper} label="ผู้ใหญ่" value=${a} onChange=${setA}/></div>
          <div class="person"><strong>เด็ก</strong><span class="sub">${pkg && baht(pkg.childPrice) + ' · ' + pkg.childRule}</span><${Stepper} label="เด็ก" value=${c} onChange=${setC}/></div>
          <div class="person"><strong>เด็กเล็ก</strong><span class="sub">${pkg && pkg.freeRule}</span><${Stepper} label="เด็กเล็ก" value=${f} onChange=${setF}/></div>
        </div></div>
        <div class="stack" style="gap:8px"><div class="row between"><h3>ขายเสริม · เครื่องดื่ม</h3>${Object.keys(ad).length > 0 && html`<${Btn} size="sm" kind="ghost" onClick=${() => setAd({})}>ล้าง<//>`}</div>
          <div class="addons">${addons.map(x => html`<button type="button" class="addon" onClick=${() => setAd(o => ({ ...o, [x.id]: (o[x.id] || 0) + 1 }))} aria-label=${'เพิ่ม ' + x.name}>
            ${ad[x.id] > 0 && html`<span class="badge">${ad[x.id]}</span>`}<div style="font-weight:600;font-size:14px">${x.name}</div><div class="sub num">${baht(x.price)} · เหลือ ${fmt(x.stock)}</div></button>`)}</div>
          ${Object.keys(ad).some(k => ad[k] > 0) && html`<div class="row">${addons.filter(x => ad[x.id] > 0).map(x => html`<div class="row" style="gap:6px"><span class="sub">${x.name}</span><${Stepper} label=${x.name} value=${ad[x.id]} onChange=${v => setAd(o => ({ ...o, [x.id]: v }))}/></div>`)}</div>`}
        </div></div>`
      : html`<div class="stack">
        <h3>วิธีชำระเงิน</h3>
        <div class="methods">${methods.map(m => html`<button type="button" class="method" aria-pressed=${m.id === mid} onClick=${() => setMid(m.id)}>${m.name}<div class="sub" style="font-weight:400">${PAY_TYPE[m.type]}</div></button>`)}</div>
        ${method && method.type === 'cash' && html`<div class="stack" style="gap:10px">
          <${Field} label="รับเงินมา (บาท)"><input id="cash-recv" class="input num" style="font-size:22px;min-height:56px" type="number" inputmode="decimal" value=${recv} onInput=${e => setRecv(e.target.value)} placeholder=${fmt(order.total)}/><//>
          <div class="row">${quick.map(v => html`<${Btn} onClick=${() => setRecv(String(v))}>${v === order.total ? 'พอดี' : baht(v)}<//>`)}</div>
          <div class="line" style="font-size:18px"><span>เงินทอน</span><strong class=${recvN >= order.total ? 'g' : 'm'}>${recvN >= order.total ? baht(recvN - order.total, 2) : 'รับเงินยังไม่พอ'}</strong></div></div>`}
        ${method && method.type === 'qr' && html`<${PromptPayQR} id=${s.shop.promptpay} amount=${order.total}/>`}
        ${method && method.type === 'transfer' && html`<div class="banner info">ให้ลูกค้าโอนเข้าบัญชีร้าน แล้วตรวจสลิปก่อนกด รับเงิน</div>`}
        ${method && method.type === 'card' && html`<div class="banner info">รูดบัตรที่เครื่อง EDC แล้วกด รับเงิน</div>`}
      </div>`}
      ${summary}
    </div><//>`;
}

function TableDetail({ s, update, table, onClose, onAdd, onReceipt }) {
  const o = s.openTables[table.id];
  const [confirm, setConfirm] = useState(false);
  if (!o) return null;
  const pkg = s.packages.find(p => p.id === o.packageId);
  const bills = o.billIds.map(id => s.sales.find(b => b.id === id)).filter(Boolean);
  const mins = Math.floor((Date.now() - new Date(o.openedAt)) / 60000);
  const limit = s.shop.useTimer && pkg && pkg.timeLimit;
  return html`<${Modal} title=${'โต๊ะ ' + table.name} sub=${(pkg ? pkg.name : '') + ' · เปิดเมื่อ ' + thTime(o.openedAt)} onClose=${onClose}
      footer=${html`<${Btn} icon="plus" onClick=${onAdd}>สั่งเพิ่ม / เพิ่มคน<//><${Btn} kind="dark" icon="check" onClick=${() => setConfirm(true)}>เก็บโต๊ะ<//>`}>
    <div class="stack">
      <div class="stats">
        <${Stat} label="ลูกค้า" value=${o.heads.a + o.heads.c + o.heads.f + ' คน'} sub=${'ผู้ใหญ่ ' + o.heads.a + ' · เด็ก ' + o.heads.c + ' · ฟรี ' + o.heads.f}/>
        <${Stat} label="นั่งมาแล้ว" value=${Math.floor(mins / 60) + ':' + pad(mins % 60) + ' ชม.'} sub=${limit ? (mins > limit ? 'เกินเวลา ' + (mins - limit) + ' นาที' : 'เหลือ ' + (limit - mins) + ' นาที') : 'ไม่จำกัดเวลา'} tone=${limit && mins > limit ? 'red' : ''}/>
      </div>
      <h3>บิลของโต๊ะนี้ (ชำระแล้ว)</h3>
      <${DataTable} label="บิลของโต๊ะนี้" head=${false} rows=${bills} onRowClick=${b => onReceipt(b.id)} columns=${[
        { key: 'no', label: 'เลขที่' }, { key: 'at', label: 'เวลา', render: b => thTime(b.at) }, { key: 'methodName', label: 'ชำระโดย' },
        { key: 'total', label: 'ยอด', align: 'r', className: b => b.voided ? 'strike' : '', render: b => baht(b.total, 2) }]}/>
    </div>
    ${confirm && html`<${Confirm} title=${'เก็บโต๊ะ ' + table.name + '?'} text="ลูกค้ากลับแล้ว โต๊ะจะกลับเป็นโต๊ะว่าง" yes="เก็บโต๊ะ" onNo=${() => setConfirm(false)} onYes=${() => { update(st => { delete st.openTables[table.id]; }); onClose(); }}/>`}
  <//>`;
}

function TablesView({ s, update, me, toast }) {
  const [, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
  const [sheet, setSheet] = useState(null);
  const [detail, setDetail] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const [needShift, setNeedShift] = useState(null);
  const [paidId, setPaidId] = useState(null);
  const shift = openShiftOf(s);
  const tk = todayKey();
  const today = s.sales.filter(b => b.date === tk && !b.voided);
  const occ = Object.values(s.openTables);
  const inStore = sum(occ, o => o.heads.a + o.heads.c + o.heads.f);
  const tap = t => {
    if (s.openTables[t.id]) return setDetail(t.id);
    if (!shift) return setNeedShift(t);
    setSheet({ mode: 'open', table: t });
  };
  return html`<div class="stack">
    <div class="stats">
      <${Stat} label="โต๊ะว่าง" value=${(s.tables.length - occ.length) + ' / ' + s.tables.length}/>
      <${Stat} label="ลูกค้าในร้านตอนนี้" value=${inStore + ' คน'}/>
      <${Stat} label="ยอดขายวันนี้" value=${baht(sum(today, b => b.total))} sub=${today.length + ' บิล · ' + sum(today, b => b.heads.a + b.heads.c) + ' หัว'}/>
    </div>
    ${!shift && html`<div class="banner"><span class="grow">ยังไม่เปิดกะ ต้องเปิดกะก่อนจึงรับเงินได้</span><${Btn} kind="primary" onClick=${() => setNeedShift({})}>เปิดกะ<//></div>`}
    <div class="tables">${s.tables.map(t => {
      const o = s.openTables[t.id];
      if (!o) return html`<button type="button" class="tcard" onClick=${() => tap(t)}><span class="tname">${t.name}</span><span class="sub">${t.zone} · ${t.seats} ที่นั่ง</span><span class="free">ว่าง · แตะเพื่อเปิดโต๊ะ</span></button>`;
      const pkg = s.packages.find(p => p.id === o.packageId);
      const mins = Math.floor((Date.now() - new Date(o.openedAt)) / 60000);
      const limit = s.shop.useTimer && pkg && pkg.timeLimit;
      const late = limit && mins > limit;
      return html`<button type="button" class=${'tcard busy' + (late ? ' late' : '')} onClick=${() => tap(t)}>
        <div class="row between"><span class="tname">${t.name}</span><${Pill} tone=${late ? 'red' : 'orange'}>${o.heads.a + o.heads.c + o.heads.f} คน<//></div>
        <span class="sub">${pkg ? pkg.name : ''}</span>
        <span style="margin-top:auto;font-weight:600" class=${late ? 'rd' : ''}>${limit ? (late ? 'เกินเวลา ' + (mins - limit) + ' น.' : 'เหลือ ' + (limit - mins) + ' น.') : 'นั่งมา ' + mins + ' น.'}</span></button>`;
    })}</div>
    ${needShift && html`<${Modal} title="เปิดกะการขาย" onClose=${() => setNeedShift(null)}><${OpenShiftForm} s=${s} update=${update} me=${me} onDone=${() => { const t = needShift; setNeedShift(null); toast('เปิดกะแล้ว'); if (t && t.id) setSheet({ mode: 'open', table: t }); }}/><//>`}
    ${sheet && html`<${OrderSheet} s=${s} update=${update} me=${me} table=${sheet.table} mode=${sheet.mode} onClose=${() => setSheet(null)} onPaid=${id => { setSheet(null); setDetail(null); setPaidId(id); setReceipt(id); }}/>`}
    ${detail && !sheet && html`<${TableDetail} s=${s} update=${update} table=${s.tables.find(t => t.id === detail)} onClose=${() => setDetail(null)} onAdd=${() => { if (!shift) return setNeedShift({}); setSheet({ mode: 'add', table: s.tables.find(t => t.id === detail) }); }} onReceipt=${setReceipt}/>`}
    ${receipt && html`<${ReceiptModal} s=${s} billId=${receipt} fresh=${receipt === paidId} update=${update} me=${me} toast=${toast} onClose=${() => { setReceipt(null); setPaidId(null); }}/>`}
  </div>`;
}

/* ===== บิล ===== */
function BillsView({ s, update, me, toast }) {
  const [date, setDate] = useState(todayKey());
  const [receipt, setReceipt] = useState(null);
  const [page, setPage] = useState(1);
  const [q, setQ] = useState('');
  const PER = 10;
  const dayBills = s.sales.filter(b => b.date === date).sort((x, y) => y.at.localeCompare(x.at));
  const ok = dayBills.filter(b => !b.voided);
  const byMethod = {};
  for (const b of ok) byMethod[b.methodName] = (byMethod[b.methodName] || 0) + b.total;
  const needle = q.trim().toLowerCase();
  const bills = needle ? dayBills.filter(b => [b.no, b.tableName, b.methodName, b.staffName].join(' ').toLowerCase().includes(needle)) : dayBills;
  const pages = Math.max(1, Math.ceil(bills.length / PER));
  const cur = Math.min(page, pages);
  const cols = [
    { key: 'no', label: 'เลขที่', render: b => html`${b.no} ${b.voided && html`<${Pill} tone="red">ยกเลิก<//>`}` },
    { key: 'at', label: 'เวลา', render: b => thTime(b.at) }, { key: 'tableName', label: 'โต๊ะ' },
    { key: 'heads', label: 'ลูกค้า', render: b => b.heads.a + b.heads.c + b.heads.f },
    { key: 'methodName', label: 'ชำระโดย' }, { key: 'staffName', label: 'แคชเชียร์' },
    { key: 'total', label: 'ยอด', align: 'r', className: b => b.voided ? 'strike' : '', render: b => baht(b.total, 2) }];
  return html`<div class="stack">
    <${Toolbar} end=${Object.entries(byMethod).map(([k, v]) => html`<${Pill}>${k} ${baht(v)}<//>`)}>
      <${SearchBox} value=${q} onChange=${v => { setQ(v); setPage(1); }} placeholder="ค้นหาเลขที่บิล โต๊ะ ผู้รับเงิน" label="ค้นหาบิล"/>
      <${Field} label="วันที่"><input id="bills-date" class="input" type="date" value=${date} max=${todayKey()} min=${s.startDate} onInput=${e => { if (e.target.value) { setDate(e.target.value); setPage(1); } }}/><//>
    <//>
    <div class="stats"><${Stat} label="ยอดขาย" value=${baht(sum(ok, b => b.total))}/><${Stat} label="จำนวนบิล" value=${ok.length} sub=${dayBills.length - ok.length ? 'ยกเลิก ' + (dayBills.length - ok.length) + ' บิล' : ''}/><${Stat} label="ลูกค้า (หัว)" value=${sum(ok, b => b.heads.a + b.heads.c)} sub=${'ทานฟรี ' + sum(ok, b => b.heads.f) + ' คน'}/></div>
    <${DataTable} label="บิลขาย" columns=${cols} rows=${bills.slice((cur - 1) * PER, cur * PER)} onRowClick=${b => setReceipt(b.id)}
      empty=${html`<div class="card"><${Empty} title=${dayBills.length ? 'ไม่พบบิลที่ค้นหา' : 'ไม่มีบิลในวันนี้'}/></div>`}/>
    <${Pagination} page=${cur} pages=${pages} onChange=${setPage}/>
    ${receipt && html`<${ReceiptModal} s=${s} billId=${receipt} update=${update} me=${me} toast=${toast} onClose=${() => setReceipt(null)}/>`}
  </div>`;
}

/* ===== กะ ===== */
function ShiftView({ s, update, me, toast }) {
  const shift = openShiftOf(s);
  const [counted, setCounted] = useState('');
  const [confirm, setConfirm] = useState(false);
  const stats = sh => {
    const bills = s.sales.filter(b => b.shiftId === sh.id && !b.voided);
    const by = t => sum(bills.filter(b => b.methodType === t), b => b.total);
    return { bills: bills.length, cash: by('cash'), qr: by('qr'), transfer: by('transfer') + by('card'), expected: sh.float + by('cash') };
  };
  const st = shift && stats(shift);
  const staffName = id => (s.staff.find(x => x.id === id) || {}).name || '-';
  const diff = st && counted !== '' ? +counted - st.expected : null;
  const history = s.shifts.filter(x => x.closedAt).sort((a, b) => b.openedAt.localeCompare(a.openedAt)).slice(0, 14);
  return html`<div class="stack">
    ${shift ? html`<div class="card stack">
      <div class="row between"><div><h2>กะปัจจุบัน · ${staffName(shift.staffId)}</h2><div class="sub">เปิดเมื่อ ${thDate(dkey(new Date(shift.openedAt)))} ${thTime(shift.openedAt)}</div></div><${Pill} tone="green"><span class="dot"></span>เปิดอยู่<//></div>
      <div class="stats"><${Stat} label="เงินทอนตั้งต้น" value=${baht(shift.float)}/><${Stat} label="ขายเงินสด" value=${baht(st.cash)}/><${Stat} label="QR พร้อมเพย์" value=${baht(st.qr)}/><${Stat} label="โอน/บัตร" value=${baht(st.transfer)}/><${Stat} label="เงินสดที่ควรมีในลิ้นชัก" value=${baht(st.expected)} sub=${st.bills + ' บิล'}/></div>
      <div class="row" style="align-items:flex-end"><div style="width:min(260px,100%)"><${Field} label="นับเงินสดจริงในลิ้นชัก (บาท)"><input id="shift-count" class="input num" type="number" inputmode="decimal" value=${counted} onInput=${e => setCounted(e.target.value)}/><//></div>
        ${diff != null && html`<${Pill} tone=${diff === 0 ? 'green' : 'red'}>${diff === 0 ? 'ยอดตรง' : (diff > 0 ? 'เกิน ' : 'ขาด ') + baht(Math.abs(diff), 2)}<//>`}
        <${Btn} kind="dark" disabled=${counted === ''} onClick=${() => setConfirm(true)}>ปิดกะ<//></div>
    </div>` : html`<div class="card"><h2 style="margin-bottom:12px">ยังไม่เปิดกะ</h2><${OpenShiftForm} s=${s} update=${update} me=${me} onDone=${() => toast('เปิดกะแล้ว')}/></div>`}
    <h2>ประวัติกะ (14 กะล่าสุด)</h2>
    <div class="scroll"><table class="dt"><thead><tr><th>วันที่</th><th>ผู้เปิดกะ</th><th class="r">บิล</th><th class="r">ขายเงินสด</th><th class="r">QR/โอน</th><th class="r">ควรมี</th><th class="r">นับได้</th><th class="r">ส่วนต่าง</th></tr></thead><tbody>
      ${history.map(h => { const x = stats(h), d = h.counted - x.expected; return html`<tr><td>${thDate(dkey(new Date(h.openedAt)))}</td><td>${staffName(h.staffId)}</td><td class="r">${x.bills}</td><td class="r">${fmt(x.cash)}</td><td class="r">${fmt(x.qr + x.transfer)}</td><td class="r">${fmt(x.expected)}</td><td class="r">${fmt(h.counted)}</td><td class=${'r ' + (d ? 'rd' : 'g')}>${d ? (d > 0 ? '+' : '') + fmt(d) : 'ตรง'}</td></tr>`; })}
    </tbody></table></div>
    ${confirm && html`<${Confirm} title="ปิดกะ?" text=${'นับได้ ' + baht(+counted, 2) + (diff ? ' · ส่วนต่าง ' + baht(diff, 2) : ' · ยอดตรง')} yes="ปิดกะ" onNo=${() => setConfirm(false)} onYes=${() => { update(x => { const sh = openShiftOf(x); sh.closedAt = new Date().toISOString(); sh.counted = +counted; sh.closedBy = me.id; }); setConfirm(false); setCounted(''); toast('ปิดกะแล้ว'); }}/>`}
  </div>`;
}

/* ===== สต็อก ===== */
function PurchaseModal({ s, initial, onSave, onClose }) {
  const [p, setP] = useState(initial);
  const [err, setErr] = useState('');
  const setLine = (i, k, v) => setP(x => ({ ...x, lines: x.lines.map((l, j) => j === i ? { ...l, [k]: v } : l) }));
  const ingOf = id => s.ingredients.find(x => x.id === id);
  const copyLast = () => {
    const last = s.purchases.filter(x => x.supplierId === p.supplierId && x.id !== p.id).sort((a, b) => b.at.localeCompare(a.at))[0];
    if (!last) return setErr('ยังไม่เคยซื้อจากร้านนี้');
    setErr(''); setP(x => ({ ...x, lines: last.lines.map(l => ({ ...l })) }));
  };
  const total = sum(p.lines, l => +l.total || 0);
  const save = () => {
    const lines = p.lines.filter(l => l.ingId && +l.qty > 0);
    if (!lines.length) return setErr('ใส่อย่างน้อย 1 รายการที่มีจำนวนมากกว่า 0');
    onSave({ ...p, lines: lines.map(l => ({ ingId: l.ingId, qty: +l.qty, total: +l.total || 0 })) });
  };
  return html`<${Modal} wide title=${initial.isNew ? 'รับของเข้า' : 'แก้ไขบิลซื้อของ'} sub="ใส่จำนวนและยอดเงินตามบิล ระบบคิดราคาต่อหน่วยให้" onClose=${onClose}
     footer=${html`<span class="grow num" style="font-weight:700;font-size:18px">รวม ${baht(total, 2)}</span><${Btn} onClick=${onClose}>ยกเลิก<//><${Btn} kind="primary" icon="check" onClick=${save}>บันทึก<//>`}>
    <div class="stack">
      <div class="form-grid">
        <${Field} label="วันที่ซื้อ"><input id="pur-date" class="input" type="date" value=${p.date} min=${s.startDate} max=${todayKey()} onInput=${e => setP(x => ({ ...x, date: e.target.value }))}/><//>
        <${Field} label="ซื้อจาก"><select id="pur-sup" class="input" value=${p.supplierId} onChange=${e => setP(x => ({ ...x, supplierId: e.target.value }))}>${s.suppliers.map(x => html`<option value=${x.id}>${x.name}</option>`)}</select><//>
        <${Field} label="หมายเหตุ"><input id="pur-note" class="input" value=${p.note} onInput=${e => setP(x => ({ ...x, note: e.target.value }))}/><//>
      </div>
      <div class="row"><${Btn} icon="copy" onClick=${copyLast}>ใช้รายการเดิมจากครั้งก่อน<//><span class="sub">ร้านหมูกระทะซื้อของซ้ำทุกวัน กดครั้งเดียวแล้วแก้เฉพาะตัวเลข</span></div>
      ${p.lines.map((l, i) => { const ing = ingOf(l.ingId); return html`<div class="lines-edit">
        <${Field} label=${i ? '' : 'รายการ'}><select id=${'pl-ing-' + i} class="input" value=${l.ingId} onChange=${e => setLine(i, 'ingId', e.target.value)}><option value="">เลือกวัตถุดิบ</option>${s.ingredients.map(x => html`<option value=${x.id}>${x.name} (${x.unit})</option>`)}</select><//>
        <${Field} label=${i ? '' : 'จำนวน'} hint=${ing ? ing.unit : ''}><input id=${'pl-q-' + i} class="input num" type="number" inputmode="decimal" step="any" value=${l.qty} onInput=${e => setLine(i, 'qty', e.target.value)}/><//>
        <${Field} label=${i ? '' : 'ยอดเงิน (บาท)'} hint=${+l.qty > 0 && +l.total > 0 ? fmt(l.total / l.qty, 2) + ' ฿/' + (ing ? ing.unit : 'หน่วย') : ''}><input id=${'pl-t-' + i} class="input num" type="number" inputmode="decimal" step="any" value=${l.total} onInput=${e => setLine(i, 'total', e.target.value)}/><//>
        <${Btn} kind="ghost" icon="trash" aria-label="ลบบรรทัด" onClick=${() => setP(x => ({ ...x, lines: x.lines.filter((_, j) => j !== i) }))}/></div>`; })}
      <div><${Btn} icon="plus" onClick=${() => setP(x => ({ ...x, lines: [...x.lines, { ingId: '', qty: '', total: '' }] }))}>เพิ่มบรรทัด<//></div>
      ${err && html`<p class="rd" style="margin:0">${err}</p>`}
    </div><//>`;
}

/* ===== ภาพรวม ===== */
function ProfitChart({ days }) {
  const W = Math.max(days.length * 26, 260), H = 200, top = 16, bottom = 28, left = 8;
  const vals = days.map(d => d.profit == null ? 0 : d.profit);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const y = v => top + (max - v) / (max - min) * (H - top - bottom);
  const bw = (W - left * 2) / days.length;
  return html`<div style="overflow-x:auto"><svg class="chart" viewBox=${`0 0 ${W} ${H}`} width="100%" style=${`min-width:${Math.min(W, 520)}px;height:auto`} role="img" aria-label="กราฟกำไรรายวัน">
    <line class="axis" x1="0" x2=${W} y1=${y(max)} y2=${y(max)}/>
    <text x=${W - 4} y=${y(max) - 4} text-anchor="end">${fmt(max)}</text>
    ${days.map((d, i) => { const x = left + i * bw + bw * .18, w = bw * .64; if (d.profit == null) return html`<rect class="open" x=${x} y=${y(0) - 4} width=${w} height="4" rx="1"><title>${thDateShort(d.date)} ยังไม่ปิดยอด</title></rect>`;
      const y0 = y(Math.max(0, d.profit)), hgt = Math.max(1, Math.abs(y(d.profit) - y(0)));
      return html`<rect class=${d.profit >= 0 ? 'pos' : 'neg'} x=${x} y=${y0} width=${w} height=${hgt} rx="2"><title>${thDateShort(d.date)} กำไร ${baht(d.profit)}</title></rect>`; })}
    <line class="zero" x1="0" x2=${W} y1=${y(0)} y2=${y(0)}/>
    ${days.map((d, i) => (i % Math.ceil(days.length / 10) === 0 || i === days.length - 1) && html`<text x=${left + i * bw + bw / 2} y=${H - 8} text-anchor="middle">${parseKey(d.date).getDate()}</text>`)}
  </svg></div>`;
}

function DashboardView({ s, ledger }) {
  const [range, setRange] = useState('30');
  const tk = todayKey();
  const all = ledger.days;
  const days = range === 'today' ? all.filter(d => d.date === tk) : range === 'month' ? all.filter(d => d.date.slice(0, 7) === tk.slice(0, 7)) : all.slice(-(+range));
  const closed = days.filter(d => d.closed);
  const net = sum(days, d => d.net), heads = sum(days, d => d.heads);
  const ingCost = sum(closed, d => d.ingCost), addonCost = sum(closed, d => d.addonCost);
  const profit = sum(closed, d => d.profit);
  const cHeads = sum(closed, d => d.heads), cBuffet = sum(closed, d => d.buffetNet);
  const todayOpen = days.some(d => d.isToday && !d.closed);
  const ingShare = s.ingredients.map(i => ({ i, v: sum(closed, d => { const r = d.rows.find(x => x.ing.id === i.id); return r && r.cost || 0; }) })).sort((a, b) => b.v - a.v);
  const addonAgg = {};
  for (const b of s.sales) if (!b.voided && days.some(d => d.date === b.date)) for (const l of b.lines) if (l.type === 'addon') { const a = addonAgg[l.name] = addonAgg[l.name] || { q: 0, rev: 0, cost: 0 }; a.q += l.qty; a.rev += l.qty * l.price; a.cost += l.qty * (l.cost || 0); }
  const best = closed.length ? closed.reduce((a, b) => b.profit > a.profit ? b : a) : null;
  const worst = closed.length ? closed.reduce((a, b) => b.profit < a.profit ? b : a) : null;
  return html`<div class="stack">
    <div class="row between"><${Seg} label="ช่วงเวลา" value=${range} onChange=${setRange} items=${[['today', 'วันนี้'], ['7', '7 วัน'], ['month', 'เดือนนี้'], ['30', '30 วัน']]}/>
      <span class="sub">${days.length ? thDate(days[0].date) + ' – ' + thDate(days[days.length - 1].date) : ''}</span></div>
    ${todayOpen && html`<div class="banner"><span class="grow">วันนี้ยังไม่ได้นับของเหลือ กำไรของวันนี้จึงยังไม่รวมในตัวเลขด้านล่าง</span><a class="btn btn-primary" href="#stock">ไปนับของเหลือ</a></div>`}
    <div class="stats">
      <${Stat} label="กำไรขั้นต้น" value=${closed.length ? baht(profit) : '–'} tone=${profit >= 0 ? 'green' : 'red'} sub=${closed.length + ' วันที่ปิดยอดแล้ว'}/>
      <${Stat} label="ยอดขาย (ก่อน VAT)" value=${baht(net)} sub=${sum(days, d => d.bills) + ' บิล'}/>
      <${Stat} label="ต้นทุนวัตถุดิบที่ใช้" value=${closed.length ? baht(ingCost) : '–'} sub=${'ต้นทุนเครื่องดื่ม ' + baht(addonCost)}/>
      <${Stat} label="ลูกค้า" value=${fmt(heads) + ' หัว'} sub=${days.length ? 'เฉลี่ย ' + fmt(heads / days.length) + ' หัว/วัน' : ''}/>
      <${Stat} label="ต้นทุนวัตถุดิบต่อหัว" value=${cHeads ? baht(ingCost / cHeads, 2) : '–'} sub=${s.packages[0] ? 'เทียบราคา ' + s.packages[0].name + ' ' + baht(s.packages[0].adultPrice) : ''}/>
      <${Stat} label="Food cost บุฟเฟต์" value=${cBuffet ? fmt(ingCost / cBuffet * 100, 1) + '%' : '–'} tone=${cBuffet && ingCost / cBuffet > .4 ? 'red' : ''} sub="ต้นทุนวัตถุดิบ ÷ ยอดขายบุฟเฟต์"/>
    </div>
    ${days.length > 1 && html`<div class="card stack" style="gap:8px"><div class="row between"><h2>กำไรรายวัน</h2><span class="sub">เขียว = กำไร · แดง = ขาดทุน · เทา = ยังไม่ปิดยอด</span></div><${ProfitChart} days=${days}/>
      ${best && html`<div class="row"><${Pill} tone="green">ดีที่สุด ${thDateShort(best.date)} ${baht(best.profit)}<//><${Pill} tone=${worst.profit < 0 ? 'red' : ''}>ต่ำสุด ${thDateShort(worst.date)} ${baht(worst.profit)}<//></div>`}</div>`}
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
      <div class="card stack" style="gap:10px"><h2>ต้นทุนวัตถุดิบแยกรายการ</h2>
        ${ingCost ? html`<table class="dt"><tbody>${ingShare.filter(x => x.v > 0).slice(0, 8).map(x => html`<tr><td>${x.i.name}</td><td style="width:35%"><div class="share"><i style=${'width:' + (x.v / ingShare[0].v * 100) + '%'}></i></div></td><td class="r">${fmt(x.v)}</td><td class="r m">${fmt(x.v / ingCost * 100, 0)}%</td></tr>`)}</tbody></table>` : html`<${Empty} title="ยังไม่มีวันที่ปิดยอดในช่วงนี้"/>`}</div>
      <div class="card stack" style="gap:10px"><h2>ขายเสริม · เครื่องดื่ม</h2>
        ${Object.keys(addonAgg).length ? html`<table class="dt"><thead><tr><th>สินค้า</th><th class="r">จำนวน</th><th class="r">ยอดขาย</th><th class="r">กำไร</th></tr></thead><tbody>${Object.entries(addonAgg).sort((a, b) => b[1].rev - a[1].rev).map(([k, v]) => html`<tr><td>${k}</td><td class="r">${fmt(v.q)}</td><td class="r">${fmt(v.rev)}</td><td class="r g">${fmt(v.rev - v.cost)}</td></tr>`)}</tbody></table>` : html`<${Empty} title="ยังไม่มีการขายเสริม"/>`}</div>
    </div>
    <p class="sub" style="margin:0">กำไรขั้นต้น = ยอดขายก่อน VAT − ต้นทุนวัตถุดิบที่ใช้ − ต้นทุนเครื่องดื่ม · ยังไม่รวมค่าแก๊ส ค่าแรง ค่าเช่า (รอยืนยันกับร้าน) · ต้นทุนต่อหน่วยใช้วิธีเฉลี่ยถ่วงน้ำหนัก (รอยืนยัน)</p>
  </div>`;
}

/* ===== รายงาน ===== */
function ReportsView({ ledger }) {
  const months = [...new Set(ledger.days.map(d => d.date.slice(0, 7)))].reverse();
  const [m, setM] = useState(months[0]);
  const days = ledger.days.filter(d => d.date.slice(0, 7) === m);
  const closed = days.filter(d => d.closed);
  const T = k => sum(days, d => d[k]);

const STATE_ARRAYS = ['packages', 'addons', 'suppliers', 'ingredients', 'tables', 'staff', 'payments', 'sales', 'purchases', 'shifts'];
function validateState(o) {
  if (!o || typeof o !== 'object' || o.version !== 1) throw new Error('ไม่ใช่ไฟล์ข้อมูล KepToh (version 1)');
  for (const k of STATE_ARRAYS) if (!Array.isArray(o[k])) throw new Error('ไฟล์ขาดข้อมูล ' + k);
  for (const k of ['shop', 'openTables', 'counts', 'initialStock', 'seq']) if (!o[k] || typeof o[k] !== 'object') throw new Error('ไฟล์ขาดข้อมูล ' + k);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(o.startDate || '')) throw new Error('startDate ไม่ถูกต้อง');
  if (!o.staff.some(x => x.active)) throw new Error('ไม่มีพนักงานที่ใช้งานอยู่');
  return o;
}
