      ${owing.length > 0 && html`<${Stat} label="ค้างชำระ (กินก่อนจ่าย)" value=${baht(sum(owing, o => tableDue(s, o)))} tone="red" sub=${owing.length + ' โต๊ะ'}/>`}
    </div>
    ${!shift && html`<div class="banner"><span class="grow">ยังไม่เปิดกะ ต้องเปิดกะก่อนจึงรับเงินได้</span><${Btn} kind="primary" onClick=${() => setNeedShift(true)}>เปิดกะ<//></div>`}
    ${s.tables.length ? html`<div class="tables">${s.tables.map(t => html`<${TableCard} s=${s} t=${t} o=${s.openTables[t.id]} onClick=${() => { location.hash = 'tables/' + t.id; }}/>`)}</div>`
      : html`<div class="card"><${Empty} title="ยังไม่มีโต๊ะ" text="เพิ่มโต๊ะที่ ตั้งค่า › โต๊ะ"><a class="btn btn-primary" href="#setup/tables">ไปตั้งค่าโต๊ะ</a><//></div>`}
    ${needShift && html`<${Modal} title="เปิดกะการขาย" onClose=${() => setNeedShift(false)}><${OpenShiftForm} s=${s} update=${update} me=${me} onDone=${() => { setNeedShift(false); toast('เปิดกะแล้ว'); }}/><//>`}
  </div>`;
}

/* ===== บิล ===== */
function BillsView({ s, update, me, toast }) {
  const [date, setDate] = useState(todayKey());
  const [receipt, setReceipt] = useState(null);
  const [page, setPage] = useState(1);
  const [q, setQ] = useState('');
  const [fOpen, setFOpen] = useState(false);
  const [flt, setFlt] = useState({ methods: [], status: 'all' });
  const fCount = flt.methods.length + (flt.status !== 'all' ? 1 : 0);
  const PER = 10;
  const dayBills = s.sales.filter(b => b.date === date).sort((x, y) => y.at.localeCompare(x.at));
  const ok = dayBills.filter(b => !b.voided);
  const byMethod = {};
  for (const b of ok) byMethod[b.methodName] = (byMethod[b.methodName] || 0) + b.total;
  const needle = q.trim().toLowerCase();
  const bills = dayBills.filter(b => (!needle || [b.no, b.tableName, b.methodName, b.staffName].join(' ').toLowerCase().includes(needle)) && (!flt.methods.length || flt.methods.includes(b.methodId)) && (flt.status === 'all' || (flt.status === 'void') === !!b.voided));
  const pages = Math.max(1, Math.ceil(bills.length / PER));
  const cur = Math.min(page, pages);
  const cols = [
    { key: 'no', label: 'เลขที่', render: b => html`${b.no} ${b.voided && html`<${Pill} tone="red">ยกเลิก<//>`}` },
    { key: 'at', label: 'เวลา', render: b => thTime(b.at) }, { key: 'tableName', label: 'โต๊ะ' },
    { key: 'heads', label: 'ลูกค้า', render: b => b.heads.a + b.heads.c + b.heads.f },
    { key: 'methodName', label: 'ชำระโดย' }, { key: 'staffName', label: 'แคชเชียร์' },
    { key: 'total', label: 'ยอด', align: 'r', className: b => b.voided ? 'strike' : '', render: b => baht(b.total, 2) }];
  return html`<div class="stack">
    <${Toolbar} end=${Object.entries(byMethod).map(([k, v]) => html`<${Pill}>${k} ${baht(v)}<//>`)}>
      <${SearchBox} value=${q} onChange=${v => { setQ(v); setPage(1); }} placeholder="ค้นหาเลขที่บิล โต๊ะ ผู้รับเงิน" label="ค้นหาบิล"/>
      <${Field} label="วันที่"><input id="bills-date" class="input" type="date" value=${date} max=${todayKey()} min=${s.startDate} onInput=${e => { if (e.target.value) { setDate(e.target.value); setPage(1); } }}/><//>
      <${Btn} icon="filter" onClick=${() => setFOpen(true)}>ตัวกรอง${fCount ? ' (' + fCount + ')' : ''}<//>
    <//>
    <div class="stats"><${Stat} label="ยอดขาย" value=${baht(sum(ok, b => b.total))}/><${Stat} label="จำนวนบิล" value=${ok.length} sub=${dayBills.length - ok.length ? 'ยกเลิก ' + (dayBills.length - ok.length) + ' บิล' : ''}/><${Stat} label="ลูกค้า (หัว)" value=${sum(ok, b => b.heads.a + b.heads.c)} sub=${'ทานฟรี ' + sum(ok, b => b.heads.f) + ' คน'}/></div>
    <${DataTable} label="บิลขาย" columns=${cols} rows=${bills.slice((cur - 1) * PER, cur * PER)} onRowClick=${b => setReceipt(b.id)}
      empty=${html`<div class="card"><${Empty} title=${dayBills.length ? 'ไม่พบบิลที่ค้นหา' : 'ไม่มีบิลในวันนี้'}/></div>`}/>
    ${fOpen && html`<${Drawer} side="right" label="ตัวกรองบิล" onClose=${() => setFOpen(false)}>
      <div class="dr-head"><h2>ตัวกรองบิล</h2><${Btn} kind="ghost" icon="x" aria-label="ปิด" onClick=${() => setFOpen(false)}/></div>
      <div class="field"><span>วิธีชำระเงิน</span>${s.payments.map(m => html`<label class="toggle"><input type="checkbox" checked=${flt.methods.includes(m.id)} onChange=${e => { setFlt(f => ({ ...f, methods: e.target.checked ? [...f.methods, m.id] : f.methods.filter(x => x !== m.id) })); setPage(1); }}/><span>${m.name}</span></label>`)}</div>
      <div class="field"><span>สถานะบิล</span><${Seg} label="สถานะบิล" value=${flt.status} onChange=${v => { setFlt(f => ({ ...f, status: v })); setPage(1); }} items=${[['all', 'ทั้งหมด'], ['ok', 'ปกติ'], ['void', 'ยกเลิก']]}/></div>
      <div class="dr-foot stack" style="gap:8px"><${Btn} kind="primary" block onClick=${() => setFOpen(false)}>ดูผล (${bills.length} บิล)<//><${Btn} block disabled=${!fCount} onClick=${() => { setFlt({ methods: [], status: 'all' }); setPage(1); }}>ล้างตัวกรอง<//></div>
    <//>`}
    <${Pagination} page=${cur} pages=${pages} onChange=${setPage}/>
    ${receipt && html`<${ReceiptModal} s=${s} billId=${receipt} update=${update} me=${me} toast=${toast} onClose=${() => setReceipt(null)}/>`}
  </div>`;
}

/* ===== กะ ===== */
function ShiftView({ s, update, me, toast }) {
  const shift = openShiftOf(s);
  const [counted, setCounted] = useState('');
  const [confirm, setConfirm] = useState(false);
  const stats = sh => {
    const bills = s.sales.filter(b => b.shiftId === sh.id && !b.voided);
    const by = t => sum(bills.filter(b => b.methodType === t), b => b.total);
    return { bills: bills.length, cash: by('cash'), qr: by('qr'), transfer: by('transfer') + by('card'), expected: sh.float + by('cash') };
  };
  const st = shift && stats(shift);
  const staffName = id => (s.staff.find(x => x.id === id) || {}).name || '-';
  const diff = st && counted !== '' ? +counted - st.expected : null;
  const history = s.shifts.filter(x => x.closedAt).sort((a, b) => b.openedAt.localeCompare(a.openedAt)).slice(0, 14);
  const owing = s.tables.filter(x => s.openTables[x.id] && tableDue(s, s.openTables[x.id]) > 0);
  const owed = sum(owing, x => tableDue(s, s.openTables[x.id]));
  return html`<div class="stack">
    ${shift ? html`<div class="card stack">
      <div class="row between"><div><h2>กะปัจจุบัน · ${staffName(shift.staffId)}</h2><div class="sub">เปิดเมื่อ ${thDate(dkey(new Date(shift.openedAt)))} ${thTime(shift.openedAt)}</div></div><${Pill} tone="green"><span class="dot"></span>เปิดอยู่<//></div>
      <div class="stats"><${Stat} label="เงินทอนตั้งต้น" value=${baht(shift.float)}/><${Stat} label="ขายเงินสด" value=${baht(st.cash)}/><${Stat} label="QR พร้อมเพย์" value=${baht(st.qr)}/><${Stat} label="โอน/บัตร" value=${baht(st.transfer)}/><${Stat} label="เงินสดที่ควรมีในลิ้นชัก" value=${baht(st.expected)} sub=${st.bills + ' บิล'}/></div>
      <div class="row" style="align-items:flex-end"><div style="width:min(260px,100%)"><${Field} label="นับเงินสดจริงในลิ้นชัก (บาท)"><input id="shift-count" class="input num" type="number" inputmode="decimal" value=${counted} onInput=${e => setCounted(e.target.value)}/><//></div>
        ${diff != null && html`<${Pill} tone=${diff === 0 ? 'green' : 'red'}>${diff === 0 ? 'ยอดตรง' : (diff > 0 ? 'เกิน ' : 'ขาด ') + baht(Math.abs(diff), 2)}<//>`}
        <${Btn} kind="dark" disabled=${counted === ''} onClick=${() => setConfirm(true)}>ปิดกะ<//></div>
    </div>` : html`<div class="card"><h2 style="margin-bottom:12px">ยังไม่เปิดกะ</h2><${OpenShiftForm} s=${s} update=${update} me=${me} onDone=${() => toast('เปิดกะแล้ว')}/></div>`}
    ${shift && owing.length > 0 && html`<div class="banner"><span class="grow">มีโต๊ะค้างชำระ (กินก่อนจ่าย) ${owing.map(x => x.name).join(', ')} รวม <strong>${baht(owed, owed % 1 ? 2 : 0)}</strong> · ปิดกะได้ แต่ยอดนี้จะยังไม่อยู่ในกะนี้ (นับตามวันที่รับเงิน)</span><a class="btn btn-primary" href="#tables">ไปหน้าโต๊ะ</a></div>`}
    <${PageHeader} title="ประวัติกะ (14 กะล่าสุด)"/>
    <${DataTable} label="ประวัติกะ" rows=${history} empty=${html`<div class="card"><${Empty} title="ยังไม่มีประวัติกะ"/></div>`} columns=${[
      { key: 'd', label: 'วันที่', render: h => thDate(dkey(new Date(h.openedAt))) }, { key: 'who', label: 'ผู้เปิดกะ', render: h => staffName(h.staffId) },
      { key: 'bills', label: 'บิล', align: 'r', render: h => stats(h).bills }, { key: 'cash', label: 'ขายเงินสด', align: 'r', render: h => fmt(stats(h).cash) },
      { key: 'qr', label: 'QR/โอน', align: 'r', render: h => fmt(stats(h).qr + stats(h).transfer) }, { key: 'exp', label: 'ควรมี', align: 'r', render: h => fmt(stats(h).expected) },
      { key: 'cnt', label: 'นับได้', align: 'r', render: h => fmt(h.counted) },
      { key: 'diff', label: 'ส่วนต่าง', align: 'r', className: h => h.counted - stats(h).expected ? 'rd' : 'g', render: h => { const d = h.counted - stats(h).expected; return d ? (d > 0 ? '+' : '') + fmt(d) : 'ตรง'; } }]}/>
    ${confirm && html`<${Confirm} title="ปิดกะ?" text=${'นับได้ ' + baht(+counted, 2) + (diff ? ' · ส่วนต่าง ' + baht(diff, 2) : ' · ยอดตรง') + (owing.length ? ' · มีโต๊ะค้างชำระ ' + owing.length + ' โต๊ะ (' + baht(owed, owed % 1 ? 2 : 0) + ')' : '')} yes="ปิดกะ" onNo=${() => setConfirm(false)} onYes=${() => { update(x => { const sh = openShiftOf(x); sh.closedAt = new Date().toISOString(); sh.counted = +counted; sh.closedBy = me.id; }); setConfirm(false); setCounted(''); toast('ปิดกะแล้ว'); }}/>`}
  </div>`;
}

/* ===== สต็อก ===== */
function PurchaseModal({ s, initial, onSave, onClose }) {
  const [p, setP] = useState(initial);
  const [err, setErr] = useState('');
  const setLine = (i, k, v) => setP(x => ({ ...x, lines: x.lines.map((l, j) => j === i ? { ...l, [k]: v } : l) }));
  const ingOf = id => s.ingredients.find(x => x.id === id);
  const copyLast = () => {
    const last = s.purchases.filter(x => x.supplierId === p.supplierId && x.id !== p.id).sort((a, b) => b.at.localeCompare(a.at))[0];
    if (!last) return setErr('ยังไม่เคยซื้อจากร้านนี้');
    setErr(''); setP(x => ({ ...x, lines: last.lines.map(l => ({ ...l })) }));
  };
  const total = sum(p.lines, l => +l.total || 0);
  const save = () => {
    const lines = p.lines.filter(l => l.ingId && +l.qty > 0);
    if (!lines.length) return setErr('ใส่อย่างน้อย 1 รายการที่มีจำนวนมากกว่า 0');
    onSave({ ...p, lines: lines.map(l => ({ ingId: l.ingId, qty: +l.qty, total: +l.total || 0 })) });
  };
  return html`<${Modal} wide title=${initial.isNew ? 'รับของเข้า' : 'แก้ไขบิลซื้อของ'} sub="ใส่จำนวนและยอดเงินตามบิล ระบบคิดราคาต่อหน่วยให้" onClose=${onClose}
     footer=${html`<span class="grow num" style="font-weight:700;font-size:18px">รวม ${baht(total, 2)}</span><${Btn} onClick=${onClose}>ยกเลิก<//><${Btn} kind="primary" icon="check" onClick=${save}>บันทึก<//>`}>
    <div class="stack">
      <div class="form-grid">
        <${Field} label="วันที่ซื้อ"><input id="pur-date" class="input" type="date" value=${p.date} min=${s.startDate} max=${todayKey()} onInput=${e => setP(x => ({ ...x, date: e.target.value }))}/><//>
        <${Field} label="ซื้อจาก"><select id="pur-sup" class="input" value=${p.supplierId} onChange=${e => setP(x => ({ ...x, supplierId: e.target.value }))}>${s.suppliers.map(x => html`<option value=${x.id}>${x.name}</option>`)}</select><//>
        <${Field} label="หมายเหตุ"><input id="pur-note" class="input" value=${p.note} onInput=${e => setP(x => ({ ...x, note: e.target.value }))}/><//>
      </div>
      <div class="row"><${Btn} icon="copy" onClick=${copyLast}>ใช้รายการเดิมจากครั้งก่อน<//><span class="sub">ร้านหมูกระทะซื้อของซ้ำทุกวัน กดครั้งเดียวแล้วแก้เฉพาะตัวเลข</span></div>
      ${p.lines.map((l, i) => { const ing = ingOf(l.ingId); return html`<div class="lines-edit">
        <${Field} label=${i ? '' : 'รายการ'}><select id=${'pl-ing-' + i} class="input" value=${l.ingId} onChange=${e => setLine(i, 'ingId', e.target.value)}><option value="">เลือกวัตถุดิบ</option>${s.ingredients.map(x => html`<option value=${x.id}>${x.name} (${x.unit})</option>`)}</select><//>
        <${Field} label=${i ? '' : 'จำนวน'} hint=${ing ? ing.unit : ''}><input id=${'pl-q-' + i} class="input num" type="number" inputmode="decimal" step="any" value=${l.qty} onInput=${e => setLine(i, 'qty', e.target.value)}/><//>
        <${Field} label=${i ? '' : 'ยอดเงิน (บาท)'} hint=${+l.qty > 0 && +l.total > 0 ? fmt(l.total / l.qty, 2) + ' ฿/' + (ing ? ing.unit : 'หน่วย') : ''}><input id=${'pl-t-' + i} class="input num" type="number" inputmode="decimal" step="any" value=${l.total} onInput=${e => setLine(i, 'total', e.target.value)}/><//>
        <${Btn} kind="ghost" icon="trash" aria-label="ลบบรรทัด" onClick=${() => setP(x => ({ ...x, lines: x.lines.filter((_, j) => j !== i) }))}/></div>`; })}
      <div><${Btn} icon="plus" onClick=${() => setP(x => ({ ...x, lines: [...x.lines, { ingId: '', qty: '', total: '' }] }))}>เพิ่มบรรทัด<//></div>
      ${err && html`<p class="rd" style="margin:0">${err}</p>`}
    </div><//>`;
}

const byLocation = ings => Object.keys(LOCATION).map(l => [l, ings.filter(i => (LOCATION[i.location] ? i.location : 'dry') === l)]).filter(([, a]) => a.length);
const isDue = (s, ing, date) => ing.countFreq !== 'weekly' || parseKey(date).getDay() === +s.shop.weeklyCountDow;

/* นับของเหลือ: เดินนับตามที่เก็บ · แตะรายการ → กดตัวเลข → Enter ไปรายการถัดไป */
function StockCount({ s, update, ledger, date, toast }) {
  const [draft, setDraft] = useState(null);
  const [showAll, setShowAll] = useState(false);
  const [active, setActive] = useState(null);
  useEffect(() => { setDraft(null); setActive(null); setShowAll(false); }, [date]);
  const day = ledger.byDate[date];
  if (!day) return null;
  const saved = s.counts[date] || {};
  const vals = draft || Object.fromEntries(s.ingredients.map(i => [i.id, saved[i.id] != null ? String(saved[i.id]) : '']));
  const due = s.ingredients.filter(i => isDue(s, i, date));
  const groups = byLocation(showAll ? s.ingredients : s.ingredients.filter(i => isDue(s, i, date) || vals[i.id] !== ''));
  const order = groups.flatMap(([, a]) => a);
  const prevKeys = Object.keys(s.counts).filter(k => k < date).sort().reverse();
  const prevOf = id => { for (const k of prevKeys) { const v = s.counts[k][id]; if (v != null && v !== '') return v; } return null; };
  const rowOf = id => day.rows.find(r => r.ing.id === id);
  const calc = ing => {
    const r = rowOf(ing.id), v = vals[ing.id];
    if (v === '' || v == null) return { used: null, cost: null };
    const weekly = ing.countFreq === 'weekly', raw = r.avail - +v, used = weekly ? raw : Math.max(0, raw);
    return { used, cost: used * r.unit, over: !weekly && raw < 0 };
  };
  const cur = active && order.some(i => i.id === active) ? active : (order.find(i => vals[i.id] === '') || order[0] || {}).id;
  const curIng = s.ingredients.find(i => i.id === cur);
  const next = () => { const i = order.findIndex(x => x.id === cur); const n = order.slice(i + 1).find(x => vals[x.id] === '') || order[i + 1]; if (n) setActive(n.id); };
  const setVal = v => { if (active !== cur) setActive(cur); setDraft(d => ({ ...(d || vals), [cur]: v })); };   // ล็อกรายการที่กำลังพิมพ์ ไม่ให้กระโดดเมื่อช่องไม่ว่างแล้ว
  const doneDue = due.filter(i => vals[i.id] !== '').length;
  const save = () => { update(st => { st.counts[date] = Object.fromEntries(s.ingredients.filter(i => vals[i.id] !== '').map(i => [i.id, +vals[i.id]])); }); setDraft(null); toast('บันทึกยอดคงเหลือและปิดวันแล้ว'); };
  const cols = [
    { key: 'name', label: 'วัตถุดิบ', render: i => { const pv = prevOf(i.id); return html`<strong>${i.name}</strong><div class="sub">${i.unit}${pv != null ? ' · ครั้งก่อน ' + fmtQ(pv) : ''}${i.countFreq === 'weekly' ? ' · นับรายสัปดาห์' : ''}</div>`; } },
    { key: 'avail', label: 'มีทั้งหมด', align: 'r', render: i => fmtQ(rowOf(i.id).avail) },
    { key: 'val', label: 'เหลือจริง', align: 'r', render: i => vals[i.id] === '' ? html`<span class="m">—</span>` : html`<strong>${vals[i.id]}</strong>` },
    { key: 'used', label: 'ใช้ไป', align: 'r', render: i => { const c = calc(i), r = rowOf(i.id); return c.over ? html`<span class="rd">เกินที่มี</span>` : c.used != null ? fmtQ(c.used) : r.est ? html`<span class="m" title="ค่าประมาณจากอัตราใช้ต่อหัว">≈ ${fmtQ(r.used)}</span>` : '–'; } },
    { key: 'cost', label: 'มูลค่า', align: 'r', render: i => { const c = calc(i); return c.cost == null ? '–' : fmt(c.cost); } }];
  return html`<div class="count-layout">
    <div class="stack">
      <div class=${'banner ' + (day.closed ? 'info' : '')}><span class="grow">${day.closed ? 'วันนี้ปิดยอดแล้ว แก้ตัวเลขแล้วกดบันทึกได้ ระบบคำนวณใหม่ให้ทั้งหมด' : 'เดินนับตามที่เก็บ ตู้เย็น → ตู้แช่ → ชั้นแห้ง · แตะรายการแล้วกดตัวเลข · Enter = รายการถัดไป'}</span>
        <label class="toggle"><input id="count-all" type="checkbox" checked=${showAll} onChange=${e => setShowAll(e.target.checked)}/><span>แสดงทุกรายการ</span></label></div>
      ${due.length < s.ingredients.length && html`<p class="sub" style="margin:0">ของนับรายสัปดาห์ (นับวัน${DOW[+s.shop.weeklyCountDow]}) ${s.ingredients.length - due.length} รายการ ระบบใช้ค่าประมาณจากอัตราใช้ต่อหัว</p>`}
      ${groups.map(([loc, items]) => html`<div class="stack" style="gap:8px"><h3 class="loc-h">${LOCATION[loc]}<span class="sub">${items.length} รายการ</span></h3>
        <${DataTable} label=${'นับของเหลือ ' + LOCATION[loc]} columns=${cols} rows=${items} onRowClick=${i => setActive(i.id)} rowClass=${i => i.id === cur ? 'active' : ''}/></div>`)}
    </div>
    <aside class="count-pad card" aria-label="ใส่จำนวนที่เหลือ">
      ${curIng ? html`<div><div class="eyebrow">${LOCATION[curIng.location] || ''}</div><h2>${curIng.name}</h2>
          <div class="sub">มีทั้งหมด ${fmtQ(rowOf(cur).avail)} ${curIng.unit}${prevOf(cur) != null ? ' · ครั้งก่อน ' + fmtQ(prevOf(cur)) : ''}</div></div>
        <output class="big-val" aria-live="polite">${vals[cur] || html`<span class="m">0</span>`} <small class="sub">${curIng.unit}</small></output>
        <${NumPad} value=${vals[cur] || ''} onChange=${setVal} decimal keyboard maxLen=${7} onEnter=${next}/>
        <${Btn} block onClick=${next}>รายการถัดไป<//>` : html`<${Empty} title="ไม่มีรายการให้นับวันนี้"/>`}
      <div class="line"><span>นับแล้ว</span><strong>${doneDue}/${due.length}</strong></div>
      <div class="line"><span>ต้นทุนจากที่นับ</span><strong class="num">${baht(sum(order, i => calc(i).cost))}</strong></div>
      <${Btn} kind="primary" size="lg" block icon="check" disabled=${doneDue !== due.length} title=${doneDue !== due.length ? 'ใส่ให้ครบทุกรายการที่ต้องนับ (ไม่มีของเหลือใส่ 0)' : ''} onClick=${save}>บันทึกและปิดวัน<//>
      ${draft && html`<${Btn} kind="ghost" block onClick=${() => setDraft(null)}>ยกเลิกที่แก้<//>`}
      ${day.closed && !draft && html`<${Btn} kind="ghost" block onClick=${() => { update(st => { delete st.counts[date]; }); toast('ยกเลิกการปิดวันแล้ว'); }}>ยกเลิกการปิดวัน<//>`}
    </aside></div>`;
}

/* รับของเข้า: แต่ละแหล่งซื้อมีปุ่ม "เหมือนครั้งก่อน" เปิดบิลที่กรอกรายการเดิมไว้ให้ แก้เฉพาะตัวเลขที่เปลี่ยน */
function StockPurchase({ s, update, date, toast }) {
  const [pur, setPur] = useState(null);
  const [del, setDel] = useState(null);
  const supName = id => (s.suppliers.find(x => x.id === id) || {}).name || '-';
  const lastOf = supId => s.purchases.filter(x => x.supplierId === supId).sort((a, b) => b.at.localeCompare(a.at))[0];
  const blank = supId => ({ id: uid('p'), isNew: true, date, supplierId: supId, note: '', lines: [{ ingId: '', qty: '', total: '' }] });
  const dayPurch = s.purchases.filter(p => p.date === date).sort((a, b) => a.at.localeCompare(b.at));
  const savePur = p => { update(st => { const { isNew, ...clean } = p; const i = st.purchases.findIndex(x => x.id === p.id); if (i >= 0) st.purchases[i] = clean; else st.purchases.push({ ...clean, at: new Date().toISOString() }); }); setPur(null); toast('บันทึกการรับของแล้ว'); };
  return html`<div class="stack">
    <${PageHeader} level=${3} title="รับของเข้า" desc="แตะ เหมือนครั้งก่อน แล้วแก้เฉพาะตัวเลขที่เปลี่ยน"/>
    <div class="sup-grid">${s.suppliers.map(sup => { const l = lastOf(sup.id); return html`<div class="card stack" style="gap:10px">
      <div><strong>${sup.name}</strong><div class="sub">${l ? 'ครั้งก่อน ' + thDateShort(l.date) + ' · ' + l.lines.length + ' รายการ · ' + baht(sum(l.lines, x => +x.total)) : 'ยังไม่เคยซื้อจากที่นี่'}</div></div>
      <div class="row"><${Btn} kind="primary" icon="copy" disabled=${!l} onClick=${() => setPur({ ...blank(sup.id), lines: l.lines.map(x => ({ ...x })) })}>เหมือนครั้งก่อน<//><${Btn} icon="plus" onClick=${() => setPur(blank(sup.id))}>รายการใหม่<//></div></div>`; })}</div>
    <${PageHeader} level=${3} title=${'ซื้อเข้าวันที่ ' + thDateShort(date)} desc=${dayPurch.length + ' บิล · รวม ' + baht(sum(dayPurch, p => sum(p.lines, l => +l.total)))}/>
    ${dayPurch.length ? dayPurch.map(p => html`<div class="card stack" style="gap:8px">
      <div class="row between"><div><strong>${supName(p.supplierId)}</strong><div class="sub">${thTime(p.at)} · ${p.lines.length} รายการ${p.note ? ' · ' + p.note : ''}</div></div>
        <div class="row"><strong class="num">${baht(sum(p.lines, l => l.total))}</strong><${Btn} size="sm" icon="edit" aria-label="แก้ไข" onClick=${() => setPur({ ...p, lines: p.lines.map(l => ({ ...l })) })}/><${Btn} size="sm" kind="danger" icon="trash" aria-label="ลบ" onClick=${() => setDel(p)}/></div></div>
      <div class="row" style="gap:6px">${p.lines.map(l => { const ing = s.ingredients.find(x => x.id === l.ingId); return html`<${Pill}>${ing ? ing.name : '?'} ${fmtQ(l.qty)} ${ing ? ing.unit : ''} · ${fmt(l.total)}฿<//>`; })}</div></div>`)
      : html`<div class="card"><${Empty} title="ยังไม่มีการรับของเข้าวันนี้" text="เลือกแหล่งซื้อด้านบน แล้วกด เหมือนครั้งก่อน"/></div>`}
    ${pur && html`<${PurchaseModal} s=${s} initial=${pur} onClose=${() => setPur(null)} onSave=${savePur}/>`}
    ${del && html`<${Confirm} title="ลบบิลซื้อของนี้?" text=${supName(del.supplierId) + ' · ' + baht(sum(del.lines, l => l.total))} yes="ลบ" danger onNo=${() => setDel(null)} onYes=${() => { update(st => { st.purchases = st.purchases.filter(x => x.id !== del.id); }); setDel(null); toast('ลบแล้ว'); }}/>`}
  </div>`;
}

/* ค่าใช้จ่ายรายวัน (ไม่เข้าสต็อก) เช่น แก๊ส น้ำแข็งใช้ในร้าน */
function ExpenseModal({ s, initial, onSave, onClose }) {
  const [lines, setLines] = useState(initial.lines);
  const [err, setErr] = useState('');
  const setLine = (i, k, v) => setLines(x => x.map((l, j) => j === i ? { ...l, [k]: v } : l));
  const save = () => { const ok = lines.filter(l => l.typeId && +l.amount > 0); if (!ok.length) return setErr('ใส่อย่างน้อย 1 รายการที่มียอดมากกว่า 0'); onSave(ok.map(l => ({ typeId: l.typeId, amount: +l.amount, note: l.note || '' }))); };
  return html`<${Modal} title=${initial.editId ? 'แก้ไขค่าใช้จ่าย' : 'บันทึกค่าใช้จ่าย · ' + thDateShort(initial.date)} sub="ค่าใช้จ่ายที่ไม่เข้าสต็อก ใช้หักกำไรสุทธิ" onClose=${onClose}
    footer=${html`<span class="grow num" style="font-weight:700;font-size:18px">รวม ${baht(sum(lines, l => +l.amount || 0))}</span><${Btn} onClick=${onClose}>ยกเลิก<//><${Btn} kind="primary" icon="check" onClick=${save}>บันทึก<//>`}>
    <div class="stack">${lines.map((l, i) => html`<div class="lines-edit">
      <${Field} label=${i ? '' : 'รายการ'}><select id=${'ex-t-' + i} class="input" value=${l.typeId} onChange=${e => setLine(i, 'typeId', e.target.value)}><option value="">เลือกประเภท</option>${s.expenseTypes.map(x => html`<option value=${x.id}>${x.name}</option>`)}</select><//>
      <${Field} label=${i ? '' : 'ยอดเงิน (บาท)'}><input id=${'ex-a-' + i} class="input num" type="number" inputmode="decimal" step="any" min="0" value=${l.amount} onInput=${e => setLine(i, 'amount', e.target.value)}/><//>
      <${Field} label=${i ? '' : 'หมายเหตุ'}><input id=${'ex-n-' + i} class="input" value=${l.note} onInput=${e => setLine(i, 'note', e.target.value)}/><//>
      <${Btn} kind="ghost" icon="trash" aria-label="ลบบรรทัด" onClick=${() => setLines(x => x.filter((_, j) => j !== i))}/></div>`)}
      ${!initial.editId && html`<div><${Btn} icon="plus" onClick=${() => setLines(x => [...x, { typeId: '', amount: '', note: '' }])}>เพิ่มบรรทัด<//></div>`}
      ${err && html`<p class="rd" style="margin:0">${err}</p>`}</div><//>`;
}
function StockExpense({ s, update, date, toast }) {
  const [ed, setEd] = useState(null);
  const [del, setDel] = useState(null);
  const typeName = id => (s.expenseTypes.find(x => x.id === id) || {}).name || '-';
  const rows = s.expenses.filter(e => e.date === date).sort((a, b) => a.at.localeCompare(b.at));
  const prevDate = [...new Set(s.expenses.filter(e => e.date < date).map(e => e.date))].sort().pop();
  const save = lines => {
    update(st => { if (ed.editId) Object.assign(st.expenses.find(e => e.id === ed.editId), lines[0]); else for (const l of lines) st.expenses.push({ id: uid('e'), date, at: new Date().toISOString(), ...l }); });
    setEd(null); toast('บันทึกค่าใช้จ่ายแล้ว');
  };
  return html`<div class="stack">
    <${PageHeader} level=${3} title=${'ค่าใช้จ่ายวันที่ ' + thDateShort(date)} desc="ไม่เข้าสต็อก · ใช้หักกำไรสุทธิ"
      actions=${html`<${Btn} icon="copy" disabled=${!prevDate} onClick=${() => setEd({ date, lines: s.expenses.filter(e => e.date === prevDate).map(e => ({ typeId: e.typeId, amount: e.amount, note: e.note || '' })) })}>เหมือนครั้งก่อน<//><${Btn} kind="primary" icon="plus" onClick=${() => setEd({ date, lines: [{ typeId: '', amount: '', note: '' }] })}>เพิ่มค่าใช้จ่าย<//>`}/>
    <${DataTable} label="ค่าใช้จ่ายรายวัน" rows=${rows} empty=${html`<div class="card"><${Empty} title="ยังไม่มีค่าใช้จ่ายวันนี้" text=${prevDate ? 'กด เหมือนครั้งก่อน เพื่อคัดลอกจากวันที่ ' + thDateShort(prevDate) : ''}/></div>`}
      columns=${[{ key: 'typeId', label: 'รายการ', render: e => typeName(e.typeId) }, { key: 'note', label: 'หมายเหตุ', render: e => e.note || '–' }, { key: 'amount', label: 'ยอด', align: 'r', render: e => baht(e.amount) },
        { key: '_act', label: 'จัดการ', align: 'r', render: e => html`<div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><${Btn} size="sm" icon="edit" aria-label=${'แก้ไข ' + typeName(e.typeId)} onClick=${() => setEd({ date, editId: e.id, lines: [{ typeId: e.typeId, amount: e.amount, note: e.note || '' }] })}/><${Btn} size="sm" kind="danger" icon="trash" aria-label=${'ลบ ' + typeName(e.typeId)} onClick=${() => setDel(e)}/></div>` }]}
      footer=${html`<tr><td colspan="2">รวม</td><td class="r">${baht(sum(rows, e => e.amount))}</td><td></td></tr>`}/>
    ${ed && html`<${ExpenseModal} s=${s} initial=${ed} onSave=${save} onClose=${() => setEd(null)}/>`}
    ${del && html`<${Confirm} title="ลบค่าใช้จ่ายนี้?" text=${typeName(del.typeId) + ' · ' + baht(del.amount)} yes="ลบ" danger onNo=${() => setDel(null)} onYes=${() => { update(st => { st.expenses = st.expenses.filter(x => x.id !== del.id); }); setDel(null); toast('ลบแล้ว'); }}/>`}
  </div>`;
}

function StockBalance({ s, ledger }) {
  const supName = id => (s.suppliers.find(x => x.id === id) || {}).name || '-';
  const rows = s.ingredients.map(i => { const c = ledger.current[i.id] || { qty: 0, avg: i.lastCost }; return { id: i.id, i, qty: c.qty, avg: c.avg, val: c.qty * c.avg, need: Math.max(0, (+i.par || 0) - c.qty) }; });
  return html`<div class="stack">
    <div class="banner info">คงเหลือล่าสุด = นับครั้งล่าสุด + ซื้อเข้าหลังจากนั้น (ของนับรายสัปดาห์หักค่าประมาณแล้ว) · แนะนำสั่งซื้อ = ระดับที่ควรมี − คงเหลือ</div>
    <${DataTable} label="คงเหลือและแนะนำสั่งซื้อ" rows=${rows} columns=${[
      { key: 'n', label: 'วัตถุดิบ', render: r => html`<strong>${r.i.name}</strong><div class="sub">${LOCATION[r.i.location] || '-'} · ${COUNT_FREQ[r.i.countFreq] || '-'}</div>` },
      { key: 'sup', label: 'ซื้อจาก', render: r => html`<span class="sub">${supName(r.i.supplierId)}</span>` },
      { key: 'qty', label: 'คงเหลือ', align: 'r', render: r => fmtQ(r.qty) + ' ' + r.i.unit },
      { key: 'avg', label: 'ต้นทุนเฉลี่ย', align: 'r', render: r => fmt(r.avg, 2) },
      { key: 'val', label: 'มูลค่าคงเหลือ', align: 'r', render: r => fmt(r.val) },
      { key: 'par', label: 'ระดับที่ควรมี', align: 'r', render: r => fmtQ(r.i.par) },
      { key: 'need', label: 'แนะนำสั่งซื้อ', align: 'r', render: r => r.need > 0 ? html`<${Pill} tone="orange">${fmtQ(roundQty(r.need, r.i.unit))} ${r.i.unit}<//>` : html`<span class="g">พอ</span>` }]}
      footer=${html`<tr><td colspan="4">มูลค่าวัตถุดิบคงเหลือรวม</td><td class="r">${baht(sum(rows, r => r.val))}</td><td colspan="2"></td></tr>`}/>
  </div>`;
}

function StockView({ s, update, ledger, toast }) {
  const [tab, setTab] = useState('count');
  const [date, setDate] = useState(todayKey());
  const p = { s, update, ledger, date, toast };
  return html`<div class="stack">
    <${Toolbar} end=${tab !== 'balance' && html`<${Field} label="วันที่"><input id="stock-date" class="input" type="date" value=${date} min=${s.startDate} max=${todayKey()} onInput=${e => e.target.value && setDate(e.target.value)}/><//>`}>
      <${Seg} label="เมนูสต็อก" value=${tab} onChange=${setTab} items=${[['count', 'นับของเหลือ (ปิดวัน)'], ['purchase', 'รับของเข้า'], ['expense', 'ค่าใช้จ่าย'], ['balance', 'คงเหลือและสั่งซื้อ']]}/>
    <//>
    ${tab === 'count' ? html`<${StockCount} ...${p}/>` : tab === 'purchase' ? html`<${StockPurchase} ...${p}/>` : tab === 'expense' ? html`<${StockExpense} ...${p}/>` : html`<${StockBalance} ...${p}/>`}

}

/* ===== ภาพรวม ===== */
function ProfitChart({ days, field = 'profit' }) {
  const W = Math.max(days.length * 26, 260), H = 200, top = 16, bottom = 28, left = 8;
  const vals = days.map(d => d[field] == null ? 0 : d[field]);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const y = v => top + (max - v) / (max - min) * (H - top - bottom);
  const bw = (W - left * 2) / days.length;
  return html`<div style="overflow-x:auto"><svg class="chart" viewBox=${`0 0 ${W} ${H}`} width="100%" style=${`min-width:${Math.min(W, 520)}px;height:auto`} role="img" aria-label="กราฟกำไรรายวัน">
    <line class="axis" x1="0" x2=${W} y1=${y(max)} y2=${y(max)}/>
    <text x=${W - 4} y=${y(max) - 4} text-anchor="end">${fmt(max)}</text>
    ${days.map((d, i) => { const x = left + i * bw + bw * .18, w = bw * .64; if (d[field] == null) return html`<rect class="open" x=${x} y=${y(0) - 4} width=${w} height="4" rx="1"><title>${thDateShort(d.date)} ยังไม่ปิดยอด</title></rect>`;
      const y0 = y(Math.max(0, d[field])), hgt = Math.max(1, Math.abs(y(d[field]) - y(0)));
      return html`<rect class=${d[field] >= 0 ? 'pos' : 'neg'} x=${x} y=${y0} width=${w} height=${hgt} rx="2"><title>${thDateShort(d.date)} กำไร ${baht(d[field])}</title></rect>`; })}
    <line class="zero" x1="0" x2=${W} y1=${y(0)} y2=${y(0)}/>
    ${days.map((d, i) => (i % Math.ceil(days.length / 10) === 0 || i === days.length - 1) && html`<text x=${left + i * bw + bw / 2} y=${H - 8} text-anchor="middle">${parseKey(d.date).getDate()}</text>`)}
  </svg></div>`;
}

const PendingBadge = () => html`<a class="pill orange" href="#setup/costing" title="สูตรเป็นค่าตั้งต้นชั่วคราว แตะเพื่อดู/ปรับ">ค่าตั้งต้น · รอยืนยันกับร้าน</a>`;

function DashboardView({ s, ledger }) {
  const [range, setRange] = useState('30');
  const tk = todayKey(), sh = { ...SHOP_DEFAULTS, ...s.shop }, showNet = sh.showNetProfit !== false;
  const field = showNet ? 'netProfit' : 'profit', fieldName = showNet ? 'กำไรสุทธิ' : 'กำไรขั้นต้น';
  const all = ledger.days;
  const days = range === 'today' ? all.filter(d => d.date === tk) : range === 'month' ? all.filter(d => d.date.slice(0, 7) === tk.slice(0, 7)) : all.slice(-(+range));
  const closed = days.filter(d => d.closed);
  const net = sum(days, d => d.net), heads = sum(days, d => d.heads);
  const ingCost = sum(closed, d => d.ingCost), addonCost = sum(closed, d => d.addonCost);
  const profit = sum(closed, d => d.profit), netProfit = sum(closed, d => d.netProfit), spend = sum(closed, d => d.expenses + d.fixed);
  const cHeadsW = sum(closed, d => d.headsW), cBuffet = sum(closed, d => d.buffetNet);
  const todayOpen = days.some(d => d.isToday && !d.closed);
  const last = all.slice().reverse().find(d => d.closed);
  const ingShare = s.ingredients.map(i => ({ id: i.id, i, v: sum(closed, d => { const r = d.rows.find(x => x.ing.id === i.id); return r && r.cost || 0; }) })).sort((a, b) => b.v - a.v);
  const addonAgg = {};
  for (const b of s.sales) if (!b.voided && days.some(d => d.date === b.date)) for (const l of b.lines) if (l.type === 'addon') { const a = addonAgg[l.name] = addonAgg[l.name] || { id: l.name, name: l.name, q: 0, rev: 0, cost: 0 }; a.q += l.qty; a.rev += l.qty * l.price; a.cost += l.qty * (l.cost || 0); }
  const best = closed.length ? closed.reduce((a, b) => b[field] > a[field] ? b : a) : null;
  const worst = closed.length ? closed.reduce((a, b) => b[field] < a[field] ? b : a) : null;
  return html`<div class="stack">
    <${Toolbar} end=${html`<span class="sub">${days.length ? thDate(days[0].date) + ' – ' + thDate(days[days.length - 1].date) : ''}</span>`}>
      <${Seg} label="ช่วงเวลา" value=${range} onChange=${setRange} items=${[['today', 'วันนี้'], ['7', '7 วัน'], ['month', 'เดือนนี้'], ['30', '30 วัน']]}/><//>
    ${last && html`<div class="card today-hero"><div class="grow">
        <div class="eyebrow">ปิดยอดล่าสุด · ${thDate(last.date)}${last.isToday ? ' (วันนี้)' : ''}</div>
        <div class=${'hero-v ' + (last[field] >= 0 ? 'g' : 'rd')}>${last[field] >= 0 ? 'กำไร' : 'ขาดทุน'} ${baht(Math.abs(last[field]))}</div>
        <div class="sub">${fieldName} · ขาย ${baht(last.net)} − วัตถุดิบ ${baht(last.ingCost)} − เครื่องดื่ม ${baht(last.addonCost)}${showNet ? ' − ค่าใช้จ่าย ' + baht(last.expenses + last.fixed) : ''}${last.estItems ? ' · มีของประมาณการ ' + last.estItems + ' รายการ' : ''}</div></div>
      <${PendingBadge}/></div>`}
    ${todayOpen && html`<div class="banner"><span class="grow">วันนี้ยังไม่ได้นับของเหลือ กำไรของวันนี้จึงยังไม่รวมในตัวเลขด้านล่าง</span><a class="btn btn-primary" href="#stock">ไปนับของเหลือ</a></div>`}
    <div class="stats">
      ${showNet && html`<${Stat} label="กำไรสุทธิ (ประมาณ)" value=${closed.length ? baht(netProfit) : '–'} tone=${netProfit >= 0 ? 'green' : 'red'} sub=${'หักค่าใช้จ่าย ' + baht(spend)}/>`}
      <${Stat} label="กำไรขั้นต้น" value=${closed.length ? baht(profit) : '–'} tone=${profit >= 0 ? 'green' : 'red'} sub=${closed.length + ' วันที่ปิดยอดแล้ว'}/>
      <${Stat} label="ยอดขาย (ก่อน VAT)" value=${baht(net)} sub=${sum(days, d => d.bills) + ' บิล'}/>
      <${Stat} label="ต้นทุนวัตถุดิบที่ใช้" value=${closed.length ? baht(ingCost) : '–'} sub=${'ต้นทุนเครื่องดื่ม ' + baht(addonCost)}/>
      <${Stat} label="ลูกค้า" value=${fmt(heads) + ' หัว'} sub=${days.length ? 'เฉลี่ย ' + fmt(heads / days.length) + ' หัว/วัน' : ''}/>
      <${Stat} label="ต้นทุนวัตถุดิบต่อหัว" value=${cHeadsW ? baht(ingCost / cHeadsW, 2) : '–'} sub=${'เด็กนับ ' + sh.childHeadWeight + ' หัว' + (s.packages[0] ? ' · ราคา ' + baht(s.packages[0].adultPrice) : '')}/>
      <${Stat} label="Food cost บุฟเฟต์" value=${cBuffet ? fmt(ingCost / cBuffet * 100, 1) + '%' : '–'} tone=${cBuffet && ingCost / cBuffet > .4 ? 'red' : ''} sub="ต้นทุนวัตถุดิบ ÷ ยอดขายบุฟเฟต์"/>
    </div>
    ${days.length > 1 && html`<div class="card stack" style="gap:8px"><div class="row between"><h2>${fieldName}รายวัน</h2><span class="sub">เขียว = กำไร · แดง = ขาดทุน · เทา = ยังไม่ปิดยอด</span></div><${ProfitChart} days=${days} field=${field}/>
      ${best && html`<div class="row"><${Pill} tone="green">ดีที่สุด ${thDateShort(best.date)} ${baht(best[field])}<//><${Pill} tone=${worst[field] < 0 ? 'red' : ''}>ต่ำสุด ${thDateShort(worst.date)} ${baht(worst[field])}<//></div>`}</div>`}
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
      <div class="card stack" style="gap:10px"><h2>ต้นทุนวัตถุดิบแยกรายการ</h2>
        <${DataTable} label="ต้นทุนวัตถุดิบแยกรายการ" head=${false} rows=${ingShare.filter(x => x.v > 0).slice(0, 8)} empty=${html`<${Empty} title="ยังไม่มีวันที่ปิดยอดในช่วงนี้"/>`} columns=${[
          { key: 'n', label: 'วัตถุดิบ', render: x => x.i.name }, { key: 'bar', label: 'สัดส่วน', render: x => html`<div class="share"><i style=${'width:' + (x.v / ingShare[0].v * 100) + '%'}></i></div>` },
          { key: 'v', label: 'บาท', align: 'r', render: x => fmt(x.v) }, { key: 'p', label: '%', align: 'r', className: () => 'm', render: x => fmt(x.v / ingCost * 100, 0) + '%' }]}/></div>
      <div class="card stack" style="gap:10px"><h2>ขายเสริม · เครื่องดื่ม</h2>

const STATE_ARRAYS = ['packages', 'addons', 'suppliers', 'ingredients', 'tables', 'staff', 'payments', 'sales', 'purchases', 'shifts', 'expenses', 'expenseTypes', 'fixedCosts'];
function validateState(o) {
  if (!o || typeof o !== 'object' || (o.version !== 1 && o.version !== 2)) throw new Error('ไม่ใช่ไฟล์ข้อมูล KepToh (version 1–2)');
  if (Array.isArray(o.ingredients) && o.shop) migrate(o);
  for (const k of STATE_ARRAYS) if (!Array.isArray(o[k])) throw new Error('ไฟล์ขาดข้อมูล ' + k);
  for (const k of ['shop', 'openTables', 'counts', 'initialStock', 'seq']) if (!o[k] || typeof o[k] !== 'object') throw new Error('ไฟล์ขาดข้อมูล ' + k);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(o.startDate || '')) throw new Error('startDate ไม่ถูกต้อง');
  if (!o.staff.some(x => x.active)) throw new Error('ไม่มีพนักงานที่ใช้งานอยู่');
  return o;
}

    { key: 'name', label: 'ชื่อ', req: true, list: true }, { key: 'phone', label: 'โทร', inputmode: 'tel', list: true }, { key: 'note', label: 'หมายเหตุ', type: 'textarea', list: true }],
    () => ({ id: uid('s'), name: '', phone: '', note: '' }),
    it => s.ingredients.some(i => i.supplierId === it.id) ? 'มีวัตถุดิบที่ผูกกับแหล่งนี้อยู่ เปลี่ยนแหล่งซื้อของวัตถุดิบเหล่านั้นก่อน' : null);
  if (sec === 'tables') body = crud('tables', 'โต๊ะ', 'ชื่อโต๊ะที่แสดงในหน้าขาย', [
    { key: 'name', label: 'ชื่อโต๊ะ', req: true, list: true }, { key: 'seats', label: 'จำนวนที่นั่ง', type: 'number', list: true }, { key: 'zone', label: 'โซน', list: true }],
    () => ({ id: uid('t'), name: '', seats: 4, zone: '' }),
    it => s.openTables[it.id] ? 'โต๊ะนี้มีลูกค้าอยู่ เก็บโต๊ะก่อนแล้วค่อยลบ' : null);
  if (sec === 'staff') body = me.role !== 'owner' ? html`<div class="card"><${Empty} title="เฉพาะเจ้าของร้าน" text="ผู้จัดการแก้ไขพนักงานไม่ได้"/></div>` : crud('staff', 'พนักงานและสิทธิ์', 'แคชเชียร์: ขาย บิล กะ สต็อก · ผู้จัดการ: + ภาพรวม รายงาน ตั้งค่า ยกเลิกบิล · เจ้าของ: ทุกอย่าง', [
    { key: 'name', label: 'ชื่อ', req: true, list: true }, { key: 'role', label: 'สิทธิ์', type: 'select', options: () => Object.entries(ROLE), list: true, show: v => ROLE[v] },
    { key: 'pin', label: 'PIN 4 หลัก', req: true, inputmode: 'numeric', max: 4, list: true, show: () => '••••' }, { key: 'active', label: 'ใช้งานอยู่', type: 'toggle', list: true }],
    () => ({ id: uid('st'), name: '', role: 'cashier', pin: '', active: true }),
    it => it.id === me.id ? 'ลบบัญชีที่กำลังใช้งานอยู่ไม่ได้' : null);
  if (sec === 'payments') body = crud('payments', 'ช่องทางชำระเงิน', 'ช่องทางที่เปิดใช้จะแสดงตอนรับเงิน', [
    { key: 'name', label: 'ชื่อที่แสดง', req: true, list: true }, { key: 'type', label: 'ประเภท', type: 'select', options: () => Object.entries(PAY_TYPE), list: true, show: v => PAY_TYPE[v] }, { key: 'active', label: 'เปิดใช้', type: 'toggle', list: true }],
    () => ({ id: uid('pm'), name: '', type: 'cash', active: true }));
  if (sec === 'costing') body = html`<${CostingForm} s=${s} update=${update} toast=${toast}/>`;
  if (sec === 'fixedCosts') body = crud('fixedCosts', 'ค่าใช้จ่ายคงที่รายเดือน', 'ยอดรวมต่อเดือน ÷ วันที่เปิดร้านต่อเดือน แล้วหักทุกวันที่มีการขาย (ใช้คิดกำไรสุทธิ)', [
    { key: 'name', label: 'รายการ', req: true, list: true }, { key: 'amount', label: 'ยอดต่อเดือน (บาท)', type: 'number', req: true, list: true }, { key: 'active', label: 'นำมาคิด', type: 'toggle', list: true }],
    () => ({ id: uid('fc'), name: '', amount: '', active: true }));
  if (sec === 'expenseTypes') body = crud('expenseTypes', 'ประเภทค่าใช้จ่ายรายวัน', 'ตัวเลือกตอนบันทึกค่าใช้จ่าย (สต็อก › ค่าใช้จ่าย)', [{ key: 'name', label: 'ชื่อ', req: true, list: true }],
    () => ({ id: uid('et'), name: '' }), it => s.expenses.some(e => e.typeId === it.id) ? 'มีค่าใช้จ่ายที่ใช้ประเภทนี้อยู่ แก้ชื่อแทนการลบได้' : null);
  if (sec === 'theme') body = html`<${ThemeSettings}/>`;
  if (sec === 'demo') body = html`<div class="card stack"><${PageHeader} title="ข้อมูลตัวอย่าง" desc="ข้อมูลเก็บในเครื่องนี้เท่านั้น"/>
    <p style="margin:0">ร้าน "${s.shop.name}" และตัวเลขทั้งหมดเป็นข้อมูลจำลองย้อนหลัง 30 วัน (ฐานข้อมูลอยู่ที่ <code>data/mock-data.js</code>) ราคาอ้างอิงช่วงราคาตลาดจากการค้นข้อมูล</p>
    <div class="row"><${Btn} icon="copy" onClick=${exportJson}>ส่งออกข้อมูล (JSON)<//><${Btn} icon="plus" onClick=${() => document.getElementById('import-file').click()}>นำเข้าข้อมูล (JSON)<//>
      <input id="import-file" type="file" accept="application/json,.json" hidden onChange=${e => { const f = e.target.files[0]; e.target.value = ''; f && importJson(f); }}/></div>
    <div><${Btn} kind="danger" onClick=${() => setReset(true)}>รีเซ็ตกลับเป็นข้อมูลตัวอย่างเริ่มต้น<//></div></div>`;
  return html`<div class="setup"><nav class="setup-nav" aria-label="หมวดตั้งค่า">${SECS.map(([k, l]) => html`<button type="button" aria-current=${sec === k} onClick=${() => setSec(k)}>${l}</button>`)}</nav><div style="min-width:0">${body}</div>
    ${reset && html`<${Confirm} title="รีเซ็ตข้อมูล?" text="ข้อมูลทั้งหมดที่ทดลองคีย์จะหายและกลับเป็นข้อมูลตัวอย่าง" yes="รีเซ็ต" danger onNo=${() => setReset(false)} onYes=${() => { update(st => { Object.keys(st).forEach(k => delete st[k]); Object.assign(st, seed()); }); setReset(false); toast('รีเซ็ตแล้ว'); }}/>`}</div>`;
}

/* ===== เข้าสู่ระบบ (เลือกพนักงาน + PIN) ===== */
const SESSION_KEY = 'keptoh-session';
const readSession = () => { try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; } };
const writeSession = id => { try { id ? sessionStorage.setItem(SESSION_KEY, id) : sessionStorage.removeItem(SESSION_KEY); } catch (e) { } };

function Login({ s, onLogin }) {
  const staff = s.staff.filter(x => x.active);
  const [id, setId] = useState((staff.find(x => x.id === s.currentStaffId) || staff[0] || {}).id);
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const who = staff.find(x => x.id === id);
  const submit = (v = pin) => {
    if (!who) return;
    if (v.length !== 4) return setErr('ใส่ PIN ให้ครบ 4 หลัก');
    if (v !== who.pin) { setPin(''); return setErr('PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง'); }
    onLogin(who);
  };
  const POINTS = [['chart', 'ต้นทุนต่อหัวและ Food cost รายวัน'], ['box', 'นับของเหลือ แล้วระบบคิดต้นทุนให้'], ['receipt', 'รับเงินสด พร้อมเพย์ โอน ในหน้าเดียว']];
  return html`<div class="login">
    <aside class="login-hero" aria-hidden="false">
      <div class="hero-brand"><span class="brand-mark"><${Icon} n="flame" s=${26}/></span>KepToh</div>
      <h1>วันนี้ขายบุฟเฟต์<br/>ได้กำไรหรือขาดทุน?</h1>
      <ul class="hero-points">${POINTS.map(([ic, tx]) => html`<li><span class="ic"><${Icon} n=${ic} s=${20}/></span>${tx}</li>`)}</ul>
      <p class="hero-foot">ต้นแบบสำหรับทดลองกด · ข้อมูลทั้งหมดเป็นข้อมูลจำลอง</p>
    </aside>
    <main class="login-panel"><div class="login-form">
      <div class="head"><span class="brand-mark"><${Icon} n="flame" s=${26}/></span><h2>เข้าสู่ระบบ</h2><div class="sub">เลือกชื่อของคุณ แล้วใส่ PIN 4 หลัก</div></div>
      <${Dropdown} label="พนักงาน" value=${id} onChange=${v => { setId(v); setPin(''); setErr(''); }} options=${staff.map(x => ({ value: x.id, label: x.name, sub: ROLE[x.role] }))} leading=${o => html`<${Avatar} name=${o.label} size=${40}/>`}/>
      <div><${PinDots} value=${pin}/><p class="login-err" role="alert">${err}</p></div>
      <${NumPad} value=${pin} onChange=${v => { setPin(v); setErr(''); }} maxLen=${4} keyboard onEnter=${submit}/>
      <${Btn} kind="primary" size="lg" block disabled=${!who} onClick=${() => submit()}>${openShiftOf(s) ? 'เข้าสู่ระบบ' : 'เข้าสู่ระบบและเปิดกะ'}<//>
      <div class="banner info" style="font-size:13px">PIN ตัวอย่าง: เจ้าของ ${(staff.find(x => x.role === 'owner') || {}).pin} · ผู้จัดการ ${(staff.find(x => x.role === 'manager') || {}).pin} · แคชเชียร์ ${(staff.find(x => x.role === 'cashier') || {}).pin}</div>
    </div></main></div>`;
}

/* ---------- 6) app shell ---------- */
const VIEWS = [
  { id: 'tables', label: 'โต๊ะ', icon: 'tables', title: 'โต๊ะและการขาย' },
  { id: 'bills', label: 'บิล', icon: 'receipt', title: 'บิลขาย' },
  { id: 'stock', label: 'สต็อก', icon: 'box', title: 'สต็อกวัตถุดิบ' },
  { id: 'shift', label: 'กะ', icon: 'clock', title: 'กะการขาย' },
  { id: 'dashboard', label: 'ภาพรวม', icon: 'chart', title: 'ภาพรวมกำไร', roles: ['owner', 'manager'] },
  { id: 'reports', label: 'รายงาน', icon: 'list', title: 'รายงานรายวัน', roles: ['owner', 'manager'] },
  { id: 'setup', label: 'ตั้งค่า', icon: 'gear', title: 'ตั้งค่าร้าน', roles: ['owner', 'manager'] }
];
const readHash = () => { const h = location.hash.replace('#', ''); return VIEWS.some(v => v.id === h.split('/')[0]) ? h : 'tables'; };   // #setup/costing = เปิดหมวดย่อย

function NavDrawer({ s, me, shift, view, go, allowed, onClose, onLogout }) {
  const who = shift && (s.staff.find(x => x.id === shift.staffId) || {}).name;
  return html`<${Drawer} label="เมนูหลัก" onClose=${onClose}>
    <div class="dr-head"><div class="brand-row"><span class="brand-mark sm"><${Icon} n="flame" s=${20}/></span>KepToh</div><${Btn} kind="ghost" icon="sidebar" aria-label="ปิดเมนู" onClick=${onClose}/></div>
    <div class="dr-user"><${Avatar} name=${me.name} size=${44}/><div class="grow"><strong>${me.name}</strong><span class="sub">${ROLE[me.role]} · ${shift ? 'กะเปิด ' + thTime(shift.openedAt) + ' น. (' + who + ')' : 'ยังไม่เปิดกะ'}</span></div></div>
    <nav class="dr-nav" aria-label="เมนู">${VIEWS.filter(allowed).map(v => html`<button type="button" class="dr-link" aria-current=${view.split('/')[0] === v.id ? 'page' : null} onClick=${() => go(v.id)}><${Icon} n=${v.icon} s=${22}/>${v.label}</button>`)}</nav>
    <div class="dr-foot"><${Btn} block icon="logout" onClick=${onLogout}>ออกจากระบบ<//></div>
  <//>`;
}

function App() {
  const [s, setS] = useState(loadState);
  const [view, setView] = useState(readHash);
  const [toastMsg, setToast] = useState('');
  const [uid, setUid] = useState(readSession);
  const [menuOpen, setMenuOpen] = useState(false);
  const [shiftAsk, setShiftAsk] = useState(false);
  useEffect(() => { const f = () => setView(readHash()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToast(''), 2400); return () => clearTimeout(t); }, [toastMsg]);
  const update = fn => setS(prev => { const next = JSON.parse(JSON.stringify(prev)); fn(next); saveState(next); return next; });
  const ledger = useMemo(() => computeLedger(s), [s]);
  const me = s.staff.find(x => x.id === uid && x.active);
  const login = who => { writeSession(who.id); update(st => { st.currentStaffId = who.id; }); setUid(who.id); setToast('สวัสดี ' + who.name); if (!openShiftOf(s)) setShiftAsk(true); };
  const logout = () => { writeSession(null); setMenuOpen(false); setShiftAsk(false); setUid(null); };
  if (!me) return html`<${Login} s=${s} onLogin=${login}/>`;
  const allowed = v => !v.roles || v.roles.includes(me.role);
  const base = view.split('/')[0], cur = VIEWS.find(v => v.id === base);
  const shift = openShiftOf(s);
  const props = { s, update, me, ledger, toast: setToast };
  const go = id => { setMenuOpen(false); if (location.hash !== '#' + id) location.hash = id; else setView(id); };   // id อาจเป็น view/section
  return html`<div class="app">
    <nav class="side" aria-label="เมนูหลัก">
      <div class="brand"><span class="brand-mark"><${Icon} n="flame" s=${26}/></span>KepToh</div>
      ${VIEWS.filter(allowed).map(v => html`<button type="button" class="nav-btn" aria-current=${base === v.id ? 'page' : null} onClick=${() => go(v.id)}><${Icon} n=${v.icon} s=${22}/>${v.label}</button>`)}
    </nav>
    <main class="main">
      <header class="topbar">
        <${Btn} kind="ghost" icon="sidebar" aria-label="เปิดเมนู" aria-expanded=${menuOpen} onClick=${() => setMenuOpen(true)}/>
        <div class="grow"><h1>${cur.title}</h1><div class="sub">${s.shop.name} · ${thDate(todayKey())}</div></div>
        <${Pill} tone="orange">ข้อมูลตัวอย่าง<//>
        ${shift ? html`<${Pill} tone="green"><span class="dot"></span>กะเปิด · ${(s.staff.find(x => x.id === shift.staffId) || {}).name}<//>` : html`<${Pill} tone="red">ยังไม่เปิดกะ<//>`}
        ${shift ? html`<${Btn} kind="danger-solid" onClick=${() => go('shift')}>ปิดกะ<//>` : html`<${Btn} kind="primary" onClick=${() => setShiftAsk(true)}>เปิดกะ<//>`}
        <span class="who"><${Avatar} name=${me.name} size=${36}/><span class="who-t"><strong>${me.name}</strong><span class="sub">${ROLE[me.role]}</span></span></span>
      </header>
      <section class="content">
        ${!allowed(cur) ? html`<div class="card"><${Empty} title="ไม่มีสิทธิ์เข้าหน้านี้" text=${ROLE[me.role] + ' เข้าหน้านี้ไม่ได้'}><${Btn} kind="primary" onClick=${logout}>ออกจากระบบเพื่อเปลี่ยนผู้ใช้<//><//></div>`
          : base === 'tables' ? (view.split('/')[1] ? html`<${SaleView} key=${view.split('/')[1]} ...${props} tableId=${view.split('/')[1]}/>` : html`<${TablesView} ...${props}/>`) : base === 'bills' ? html`<${BillsView} ...${props}/>` : base === 'stock' ? html`<${StockView} ...${props}/>`
          : base === 'shift' ? html`<${ShiftView} ...${props}/>` : base === 'dashboard' ? html`<${DashboardView} ...${props}/>` : base === 'reports' ? html`<${ReportsView} ...${props}/>` : html`<${SetupView} ...${props} initial=${view.split('/')[1]}/>`}
      </section>
    </main>
    ${menuOpen && html`<${NavDrawer} s=${s} me=${me} shift=${shift} view=${view} go=${go} allowed=${allowed} onClose=${() => setMenuOpen(false)} onLogout=${logout}/>`}
    ${shiftAsk && !shift && html`<${Modal} title="เปิดกะการขาย" onClose=${() => setShiftAsk(false)}><${OpenShiftForm} s=${s} update=${update} me=${me} onDone=${() => { setShiftAsk(false); setToast('เปิดกะแล้ว'); }}/><//>`}
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
  </div>`;
}

if (window.KEPTOH_MOCK) render(html`<${App}/>`, document.getElementById('app'));
else document.getElementById('app').textContent = 'ไม่พบไฟล์ data/mock-data.js — ต้องเก็บไฟล์นี้ไว้ในโฟลเดอร์เดียวกับ index.html';
</script>
